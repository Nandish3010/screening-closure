[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-closure-api"
version = "0.1.0"
description = "Deterministic screening-to-care closure engine (API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "tzdata>=2024.1",  # time zones for the working-day calendar on slim images
  "PyJWT[crypto]>=2.8",  # OIDC access-token verification (A29, ADR-040)
  # Observability (F14): metrics and traces; the app imports them lazily and runs without them (app/observability.py)
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-exporter-prometheus>=0.51b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-psycopg>=0.51b0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",  # parallel test runs (F15): make test uses -n auto --dist loadfile
  "hypothesis>=6.100",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running Postgres (set DATABASE_URL); run with `make test-db`",
  "oidc: needs Docker and the keycloak image; run with `make test-oidc`",
  "chaos: stops and starts containers of the running compose stack; run with `make test-chaos` only",
]
