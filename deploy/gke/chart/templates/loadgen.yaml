# The load generator runs INSIDE the cluster, so the laptop's network is not part of any latency. Its ServiceAccount may read what the
# existing tools read with kubectl (pods, logs, exec for the cgroup samples, three named Secrets, the deployments and the statefulset) and scale
# the scheduler and the watchdog; nothing outside this namespace.
{{- if .Values.loadgen.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
  labels:
    {{- include "slt.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadgen
  labels:
    {{- include "slt.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sc-postgres, sc-oidc-signing, screening-closure-secrets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadgen
  labels:
    {{- include "slt.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: loadgen }
subjects: [{ kind: ServiceAccount, name: loadgen }]
---
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  labels:
    app: loadgen
    {{- include "slt.labels" . | nindent 4 }}
spec:
  serviceAccountName: loadgen
  restartPolicy: Never
  nodeSelector: {{ toYaml .Values.loadgen.nodeSelector | nindent 4 }}
  securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: loadgen
      image: {{ .Values.images.loadgen | quote }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      command: ["bash", "/repo/deploy/gke/scenarios.sh"]
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      resources: {{ toYaml .Values.loadgen.resources | nindent 8 }}
      env:
        - { name: SC_K8S_CONTEXT, value: "" }
        - { name: SC_K8S_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
        - { name: SC_API_BASE, value: "http://closure-api:8000" }
        - { name: SC_PG_HOSTPORT, value: "postgres:5432" }
        - { name: SC_PG_SSLMODE, value: disable }
        - { name: SC_OIDC_ISSUER, value: {{ .Values.oidcIssuer | quote }} }
        - { name: SC_RUN_INFO, value: /run-info }
        - { name: SC_VALUES_FILE, value: values-gke-loadtest.yaml }
        - { name: SC_GIT_COMMIT, value: {{ .Values.loadgen.env.GIT_COMMIT | quote }} }
        - { name: SC_GIT_BRANCH, value: {{ .Values.loadgen.env.GIT_BRANCH | quote }} }
        {{- range $k, $v := .Values.loadgen.env }}
        {{- if not (has $k (list "GIT_COMMIT" "GIT_BRANCH")) }}
        - { name: {{ $k }}, value: {{ $v | quote }} }
        {{- end }}
        {{- end }}
      volumeMounts:
        - { name: results, mountPath: /results }
        - { name: run-info, mountPath: /run-info, readOnly: true }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - { name: results, emptyDir: {} }
    - { name: tmp, emptyDir: {} }
    - { name: run-info, configMap: { name: sc-run-info } }
{{- end }}
