# Providers, registration owners and the referral reroute order (A21, ADR-032).
#
# Read by api/app/providers.py. Two things are decided here so that nobody has to decide them per case:
#   * registration: a patient is registered with a primary-care provider; a new case is assigned (not accepted) to that
#     provider's default owner by `assign_ownership {auto: true}` from system:automation. A genesis payload may carry
#     `registered_provider`; the cohort pipeline (simulator/create_cases.py) sets one deterministically from the Synthea
#     patient id. A case with no (or an unknown) registered provider goes to `default_provider`.
#   * referral: when a referral is rejected or bounces, the automation re-requests the next provider in `reroute_order`
#     for the pathway's specialty, skipping providers already asked. Only when the list is exhausted does it raise
#     `review_requested {reason: reroute_exhausted}` for a coordinator. Rejections for the reasons not in
#     `reroute_reasons` (missing information, patient declined) are human decisions and are left to the reassign SLA.
#
# The owners are the development seed users (the same logins as web/src/api/identities.ts and tools/demo/scenario.py;
# names are synthetic). The event log never holds a name: the actor is `role:<opaque id>` derived from role and name
# (api/app/auth.py `opaque_user_id`). Replace this file with the real registration feed before any pilot.
version: 1
status: development seed users, synthetic; the real provider and owner directory is a pilot task
default_provider: Riverside Primary Care
registration:
  Riverside Primary Care:
    owner: {role: primary_care_owner, name: "Dr. Layla Haddad"}
  Marina Digestive Health:
    owner: {role: primary_care_owner, name: "Dr. Huda Rahman"}
referral:
  specialty_by_pathway:
    colorectal_fit: gastroenterology
    cervical_hpv: gynaecology  # second pathway; the provider names below are synthetic, like the rest of this file
    chronic_conditions: family_medicine  # third pathway: the referral goes to the person's family physician (synthetic names)
  reroute_reasons: [capacity, wrong_service, timeout]
  # Insurance networks (ADR-054): the schemes each referral provider accepts. SYNTHETIC, like every name here; replace with the
  # payers' real network lists before any pilot. Scheme codes are generic (thiqa, enhanced, basic; only `thiqa` is a real
  # scheme's name, cited in docs/commercial/buyer-map.md). A case with a known scheme is referred to the first provider in
  # the reroute order that accepts it; when none does, to the first one that does not, flagged `out_of_network` for a
  # coordinator, never blocked. A case with no scheme (or `unknown`) is routed by the order alone. A provider with no entry
  # here accepts every scheme. The mix is chosen so the demo shows both outcomes: no gastroenterology case is ever out of
  # network (the first provider in the order accepts every scheme), a Basic family-medicine case is.
  networks:
    Corniche Gastro Unit: [thiqa, enhanced, basic]
    Al Noor Endoscopy Centre: [thiqa, enhanced, basic]
    Marina Digestive Health: [thiqa, basic]
    Corniche Women's Health Unit: [thiqa, enhanced, basic]
    Al Noor Colposcopy Centre: [thiqa, enhanced]
    Marina Women's Health Clinic: [thiqa]
    Corniche Family Medicine Clinic: [thiqa, enhanced]
    Al Noor Family Practice: [thiqa, enhanced]
    Marina Family Health Centre: [thiqa]
  reroute_order:
    gastroenterology:
      - Corniche Gastro Unit
      - Al Noor Endoscopy Centre
      - Marina Digestive Health
    gynaecology:
      - Corniche Women's Health Unit
      - Al Noor Colposcopy Centre
      - Marina Women's Health Clinic
    family_medicine:
      - Corniche Family Medicine Clinic
      - Al Noor Family Practice
      - Marina Family Health Centre
