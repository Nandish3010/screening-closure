{{- $secret := include "sc.secretName" . }}
# The scheduler: HTTP to the API only, no database credentials. Several replicas elect one leader through the API's lease.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scheduler
  labels:
    app.kubernetes.io/name: scheduler
    {{- include "sc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        {{- include "sc.labels" . | nindent 8 }}
    spec:
      {{- include "sc.podCommon" . | nindent 6 }}
      containers:
        - name: scheduler
          image: "{{ .Values.images.scheduler.repository }}:{{ .Values.images.scheduler.tag }}"
          imagePullPolicy: {{ .Values.images.scheduler.pullPolicy }}
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: API_URL, value: "http://{{ .Release.Name }}-api:{{ .Values.api.service.port }}" }
            - { name: SCHEDULER_INTERVAL_SECONDS, value: {{ .Values.scheduler.intervalSeconds | quote }} }
            - { name: SCHEDULER_AUTOMATION_INTERVAL_SECONDS, value: {{ .Values.scheduler.automationIntervalSeconds | quote }} }
            - { name: SCHEDULER_EVIDENCE_INTERVAL_SECONDS, value: {{ .Values.scheduler.evidenceIntervalSeconds | quote }} }
            - { name: SCHEDULER_AGENCY_INTERVAL_SECONDS, value: {{ .Values.scheduler.agencyIntervalSeconds | quote }} }
            - { name: SCHEDULER_CADENCE_LOG_SECONDS, value: {{ .Values.scheduler.cadenceLogSeconds | quote }} }
            - { name: SCHEDULER_HOLDER, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: HEARTBEAT_PATH, value: /tmp/scheduler.json }
            {{- include "sc.secretEnv" (dict "key" "SCHEDULER_SERVICE_TOKEN" "secret" $secret) | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{ toYaml .Values.scheduler.resources | nindent 12 }}
          # Alive = the heartbeat file was written in the last two minutes. Leader and follower both write it
          # (scheduler/main.py, `role` in the file), so a missing or stale file always means a stuck loop. timeoutSeconds:
          # python start-up under the 250m cpu limit takes more than the 1 s default.
          livenessProbe:
            exec:
              command: ["python", "-c", "import json,os,sys,time; p='/tmp/scheduler.json'; sys.exit(0 if os.path.exists(p) and time.time()-json.load(open(p))['wall_ts']<120 else 1)"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-watchdog
  labels:
    app.kubernetes.io/name: watchdog
    {{- include "sc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.watchdog.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: watchdog
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchdog
        {{- include "sc.labels" . | nindent 8 }}
    spec:
      {{- include "sc.podCommon" . | nindent 6 }}
      containers:
        - name: watchdog
          image: "{{ .Values.images.watchdog.repository }}:{{ .Values.images.watchdog.tag }}"
          imagePullPolicy: {{ .Values.images.watchdog.pullPolicy }}
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: API_URL, value: "http://{{ .Release.Name }}-api:{{ .Values.api.service.port }}" }
            - { name: WATCHDOG_IDLE_DAYS, value: {{ .Values.watchdog.idleDays | quote }} }
            - { name: WATCHDOG_INTERVAL_SECONDS, value: {{ .Values.watchdog.intervalSeconds | quote }} }
            {{- include "sc.secretEnv" (dict "key" "WATCHDOG_SERVICE_TOKEN" "secret" $secret) | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{ toYaml .Values.watchdog.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
