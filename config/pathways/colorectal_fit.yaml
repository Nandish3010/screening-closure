pathway: colorectal_fit
version: 0.3
description: Positive FIT result through confirmatory colonoscopy to documented closure
states:
  - result_received
  - acknowledged
  - owner_accepted
  - patient_contacted
  - patient_acknowledged
  - confirmatory_booked
  - confirmatory_completed
  - clinician_reviewed
  - closed
# Side states genuinely change the path (who may act next), so they are real states with
# transitions. `overdue` and `escalated` are deliberately NOT states: a case can be overdue
# AND in patient_contacted, so they are flags derived by replay (read model: `overdue`,
# `escalation_level`). See ADR-011.
side_states:
  - referral_rejected
  - consent_withdrawn
  - lost_contact
  - reopened
  - declined_pending_signoff
transitions:
  # Main path (the closure guard lives on the last row: evidence AND a human sign-off).
  - {from: result_received, event: acknowledge, to: acknowledged}
  - {from: acknowledged, event: accept_ownership, to: owner_accepted}
  - {from: owner_accepted, event: contact_patient, to: patient_contacted}
  - {from: patient_contacted, event: patient_acknowledge, to: patient_acknowledged}
  - {from: patient_acknowledged, event: book_confirmatory, to: confirmatory_booked}
  - {from: confirmatory_booked, event: complete_confirmatory, to: confirmatory_completed}
  - {from: confirmatory_completed, event: clinician_review, to: clinician_reviewed}
  - {from: clinician_reviewed, event: close, to: closed, requires: [evidence_ref, signed_by]}
  # Referral rejected: ownership goes back to the referrer. Re-routed by an accepted handoff
  # or a supervisor/coordinator reassignment; both return the case to owner_accepted.
  - {from: [patient_acknowledged, confirmatory_booked], event: handoff_rejected, to: referral_rejected, requires: [reason]}
  - {from: referral_rejected, event: handoff_accepted, to: owner_accepted}
  - {from: referral_rejected, event: reassign, to: owner_accepted, requires: [owner]}
  # Consent withdrawn: from any open state, outreach is frozen. The prior state is remembered
  # by replay (read model `resume_state`, never taken from the client) and restored on
  # re-consent.
  - {from: any_open, event: consent_updated, when: {withdrawn: true}, to: consent_withdrawn}
  - {from: consent_withdrawn, event: consent_updated, when: {withdrawn: false}, to: resume_state}
  # Lost contact: after N failed attempts (ADR-011: N=3 is an assumption pending clinician review).
  - {from: patient_contacted, event: mark_lost_contact, to: lost_contact, min: {failed_attempts: 3}}
  - {from: lost_contact, event: contact_patient, to: patient_contacted}
  # Reopen: a human, with a reason, sends a closed case back for clinician review. It can only
  # reach `closed` again through a fresh `close` with evidence and a sign-off.
  - {from: closed, event: reopen, to: reopened, requires: [reason]}
  - {from: reopened, event: clinician_review, to: clinician_reviewed}
  # Appointment cancelled or to be rebooked (A34, ADR-042): the case goes back to patient_acknowledged and `book_confirmatory`
  # rebooks. The milestone clocks do not move (A25: the colonoscopy clock started at the first referral request and never
  # restarts); the state SLA of patient_acknowledged (book_confirmatory) starts afresh, as for any state entry.
  - {from: confirmatory_booked, event: appointment_cancelled, to: patient_acknowledged}
  # Informed refusal (A33, ADR-042; clinician-review.md section 2.6). A person records the counselling; a DIFFERENT physician
  # signs the closure with outcome `declined`. The closure row is the only way into `closed` from this side state (the loader
  # allows it for the state named in `informed_refusal.state` only) and it carries the same evidence_ref and signed_by demand.
  - {from: [owner_accepted, patient_acknowledged, confirmatory_booked], event: record_informed_refusal, to: declined_pending_signoff, requires: [counselling_ref, counselled_by, reason]}
  # The signer must be a physician who is not the counsellor, and a clinician acts only on a case they own: if the owner
  # IS the counsellor, a coordinator or supervisor reassigns the sign-off to another physician (found by the model checker, I7).
  - {from: declined_pending_signoff, event: reassign, to: declined_pending_signoff, requires: [owner]}
  - {from: declined_pending_signoff, event: close, to: closed, when: {outcome: declined}, requires: [evidence_ref, signed_by]}
# Events that annotate a case without changing its main state. Allowed in every open state
# (never in `closed`). Effects on the read model (overdue, escalation_level, owner, ...) are
# defined in api/app/state_machine.py. None of these may close a case (loader-validated).
annotations:
  - mark_overdue
  - escalate
  - escalation_accepted
  - handoff_requested
  - handoff_accepted
  - handoff_rejected
  - consent_updated
  - contact_updated
  - review_requested
  - message_drafted
  - message_approved
  - message_rejected
  - message_sent
  - callback_requested
  - watchdog_flagged
  # A21 (ADR-032), both emitted only by the automation actor `system:automation`: `assign_ownership` names the owner of
  # a new case from the registration (the owner still accepts, and the ladder reaches them if they do not);
  # `closure_proposed` records that the evidence scan found closure evidence. Neither changes the main state, and
  # neither can close a case: `close` still needs a person, evidence and a signature.
  - assign_ownership
  - closure_proposed
  # D13: an inbound patient reply and what the triage made of it. `reply_received {channel, text_ref}` and
  # `reply_classified {intent, confidence, model_id, needs_human}`: the text itself is never in the log.
  - reply_received
  - reply_classified
  # A32 (ADR-025): the record that a patient's personal data was erased, by `system:erasure` alone. Unlike the others it
  # is accepted only in a CLOSED case (state_machine.step handles it before the open-state rule above) and it ends the
  # case: an erased case accepts no further event.
  - erasure_completed
# The decisions only a person makes. This list does not enforce anything: the single actor table
# (ACTOR_EVENTS in api/app/state_machine.py, default deny) decides who may write what, and
# tests/test_actor_table.py checks that no service row of it holds any of these events, except the one
# relay the table documents (RELAYED_HUMAN_EVENTS: system:triage passes on the patient's own callback request, D13).
human_only_events:
  - escalation_accepted
  - handoff_accepted
  - consent_updated
  - contact_updated
  - message_approved
  - message_rejected
  - callback_requested
  - reopen
  - record_informed_refusal
# Per-state SLAs: working days allowed to perform the event that leaves the state. Each clock starts when the
# state is entered. These are our own design values (assumed, not sourced); the national standards are the two
# `milestones` below. The pre-referral SLAs (acknowledge, accept_ownership, contact_patient, patient_acknowledge)
# sum to 11 working days, so a case that meets every one of them still has 4 working days left to request the
# referral inside the 15-working-day referral milestone (the book_confirmatory SLA of 5 covers the request, the
# receiving provider's acceptance and the booking, so the request itself comes early in it).
# `complete_confirmatory` has no per-state SLA: its clock is the `confirmatory_completed` milestone.
slas_working_days:
  acknowledge: 2
  accept_ownership: 1
  contact_patient: 3
  patient_acknowledge: 5
  book_confirmatory: 5
  clinician_review: 5
  close: 3            # sign-off after clinician review (A13): without it a reviewed case could never go overdue (L12)
  reassign: 2         # a rejected or bounced referral (referral_rejected) must be re-routed within 2 working days (A5)
# Milestones (A18, ADR-028, amended by A25): clocks that span states and are measured against a national standard, from
# one event to another. A milestone is met by its `until_event`; if the `until_event` has not happened `working_days`
# after the `from_event`, the sweep emits one `mark_overdue {milestone, due_at}` and walks the escalation ladder for it,
# like a state breach. `from_event` is `case_created` (the result release, as far as the case is concerned) or an event
# type; for an event type the clock starts at its FIRST occurrence and NEVER restarts (A25): a later occurrence, such as
# a second referral request after a rejection or a bounce, changes nothing, so a case passed between providers cannot be
# handed a fresh 31 days (clinician-review gap 2). A milestone whose `from_event` never happens starts when the case
# enters the state that awaits its `until_event` (a case with no formal referral keeps a colonoscopy clock, ADR-020); a
# request made after that does not restart it either.
#   * referral_requested: DoH IFHAS standard V10 (July 2025): referral to secondary care within 15 working days of
#     releasing the result. The National Guideline's own clause 12.5.2 also says 15 working days for urgent referral.
#   * confirmatory_completed: colonoscopy within 31 working days of referral. The clock starts at the first referral
#     REQUEST (`handoff_requested`), not at a provider's acceptance, and never restarts; the latest acceptance is kept in
#     the read model as `referral_accepted_at` for reporting only. The source of the 31 is the National Guideline
#     Appendix 2 (KPI table), NOT the IFHAS standard; the guideline is internally inconsistent (clause 12.5.2: 15
#     working days; Appendix 3: 31 days). docs/evidence.md section 8b.
milestones:
  referral_requested:
    from_event: case_created
    until_event: handoff_requested
    working_days: 15
    source: "DoH IFHAS standard July 2025 via docs/evidence.md section 8"
  confirmatory_completed:
    from_event: handoff_requested
    until_event: complete_confirmatory
    working_days: 31
    source: "National Guideline Appendix 2 via evidence.md"
# A rung is emitted `after_breach_days` working days after the due date; the next rung is
# only valid after the previous one (no skipping). A human in `accepted_by` accepts a rung
# with `escalation_accepted`, which stops further rungs for that breach (ADR-014).
escalation_ladder:
  - {rung: reminder, after_breach_days: 0, notify: owner, target: owner, action: reminder, accepted_by: [primary_care_owner, specialist_owner]}
  - {rung: supervisor, after_breach_days: 3, notify: owner_supervisor, target: supervisor, action: escalate, accepted_by: [supervisor]}
  - {rung: coordinator, after_breach_days: 7, notify: programme_coordinator, target: coordinator, action: escalate, accepted_by: [coordinator]}
# Referral handoff contract (A5, ADR-016). Ownership changes only when the receiving provider
# accepts. A request unanswered for `handoff_response_working_days` working days is bounced by
# the scheduler sweep with reason `handoff_bounce_reason`, which only `system:scheduler` may use.
handoff_response_working_days: 3
handoff_reject_reasons: [capacity, wrong_service, missing_info, patient_declined]
handoff_bounce_reason: timeout
closure_rule: "A case may only enter `closed` via the `close` event carrying evidence_ref and signed_by. No automated actor may emit `close`."
# Informed refusal (A33, ADR-042). `state` is the side state a recorded refusal waits in for a physician's sign-off (the `close` SLA
# above applies to it). `reasons` is the taxonomy of `record_informed_refusal.reason` (payloads.py keeps the same list; a test
# compares them). `re_offer_months`: the case shows `re_offer_due_at` = the refusal's date plus this many calendar months.
# ASSUMED 12; the AI clinician review proposed 3 (H-11 is open, clinician-review.md). Nothing re-offers automatically.
informed_refusal:
  state: declined_pending_signoff
  reasons: [personal_choice, fear_of_procedure, alternative_test_requested, other_with_note]
  re_offer_months: 12
# Appointment cancellation reasons (A34): `appointment_cancelled.reason`.
appointment_cancel_reasons: [patient_request, patient_unwell, provider_cancelled, capacity, preparation_not_done, other]
