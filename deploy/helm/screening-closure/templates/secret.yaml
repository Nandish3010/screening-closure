{{- if .Values.secrets.create }}
# Placeholders only (CHANGE_ME). For `helm template` and throw-away clusters; production uses existingSecret from Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sc.secretName" . }}
  labels:
    {{- include "sc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.placeholders }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
