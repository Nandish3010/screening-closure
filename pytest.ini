[pytest]
markers =
    integration: needs a running Postgres (set DATABASE_URL); run with `make test-db`
    chaos: stops and starts containers of the running compose stack; run with `make test-chaos` only
    oidc: needs Docker and the keycloak image; run with `make test-oidc`
    live: drives the running compose stack and the demo snapshot (tools/demo/tests); run with `make test-demo`
