# TODO native-speaker review (H2): every string in this file is an unreviewed Arabic draft.
# Until a native speaker signs off, label it "Arabic draft, unreviewed" in any submission.
# Same rules as en.yaml: plain Modern Standard Arabic, short sentences (about grade-6 reading
# level), no diagnosis, no advice beyond "the next step is ...; your care team will contact you".
# E14, non-disclosure: no message states or hints at what the screening found. IFHAS: abnormal
# results are communicated with the participant present, so a message says only that the result
# is ready, that the care team needs to talk with the patient, and who will call. The next step
# is named as an appointment ("a camera test"), never as a disease or a finding.
# Placeholders: {owner_name} {next_step} {appointment_date}. `{next_step}` and
# `{appointment_date}` are supplied in Arabic by the caller. `_with_date` variants are used when
# an appointment date is supplied. Limits: sms 320, whatsapp 600, letter 1200 characters.
version: 2
language: ar
purposes:
  # TODO native-speaker review (H2)
  result_notification:
    description: >-
      First message to the patient once the result has an accepted care owner. It states no finding;
      the care team explains the result in person or by phone.
    sms: >-
      نتيجة فحصك جاهزة، ويحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية، وهي {next_step}.
      ستتلقى اتصالاً من {owner_name}، أو يمكنك الرد على هذه الرسالة لحجز موعد.
    whatsapp: |-
      مرحباً، هذه رسالة من فريق رعايتك.

      نتيجة فحصك جاهزة، ويحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية، وهي {next_step}.

      سيشرح لك فريق رعايتك النتيجة وجهاً لوجه أو عبر الهاتف. ستتلقى اتصالاً من {owner_name}، أو يمكنك الرد على هذه الرسالة لحجز موعد.
    letter: |-
      السلام عليكم،

      نكتب إليك بخصوص فحص الكشف المبكر الذي أجريته مؤخراً. نتيجة فحصك جاهزة، ويحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية، وهي {next_step}.

      سيشرح لك فريق رعايتك النتيجة وجهاً لوجه أو عبر الهاتف. ستتلقى اتصالاً من {owner_name}، أو يمكنك التواصل مع فريق رعايتك لحجز موعد.

      المسؤول عن رعايتك هو {owner_name}، الشخص في فريق رعايتك المسؤول عن خطوتك التالية.

      مع تحياتنا،
      فريق رعايتك
  # TODO native-speaker review (H2)
  reminder:
    description: Reminder when the patient has not yet taken the next step. It states no finding.
    sms: >-
      تذكير من فريق رعايتك. نتيجة فحصك جاهزة، ولا يزال فريق رعايتك بحاجة إلى التحدث معك عن الخطوة التالية،
      وهي {next_step}. ستتلقى اتصالاً من {owner_name}، أو يمكنك الرد على هذه الرسالة لحجز موعد.
    sms_with_date: >-
      تذكير من فريق رعايتك. موعدك لإجراء {next_step} في {appointment_date}.
      المسؤول عن رعايتك هو {owner_name}. يمكنك الرد على هذه الرسالة إذا أردت تغيير الموعد.
    whatsapp: |-
      مرحباً، هذا تذكير من فريق رعايتك.

      نتيجة فحصك جاهزة، ولا يزال فريق رعايتك بحاجة إلى التحدث معك عن الخطوة التالية، وهي {next_step}.

