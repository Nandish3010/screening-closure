    example: "توقف عن الأدوية."
  - id: dose
    phrase: "جرعة"
    category: medication_or_treatment
    rationale: Medication advice.
    example: "خذ جرعة واحدة."
  - id: pills
    phrase: "حبوب"
    category: medication_or_treatment
    rationale: Medication advice.
    example: "خذ الحبوب."
  - id: laxative
    phrase: "ملين"
    category: medication_or_treatment
