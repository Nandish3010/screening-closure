apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: sc-postgres
    {{- include "slt.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app: sc-postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: sc-postgres
    {{- include "slt.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: sc-postgres } }
  template:
    metadata:
      labels:
        app: sc-postgres
        {{- include "slt.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.postgres.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: {{ toJson .Values.postgres.args }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: closure_owner }
            - { name: POSTGRES_DB, value: closure }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sc-postgres, key: password } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U closure_owner -d closure"] }
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 20
          # a loaded node must not get a healthy Postgres killed in the middle of a run: six failures of a 10 s probe (60 s) before a restart
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U closure_owner -d closure"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.postgres.shmSize }} }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "slt.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass.create }}
        storageClassName: {{ .Values.storageClass.name }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
