# Schema migration (api/migrations) as the database owner, then the closure_app password. It runs before each install and
# upgrade (a Helm hook), so the API pods that start next find the schema in place. The ONE workload with the owner's credentials.
# The Secret and ConfigMap it reads must exist before the release (existingSecret), because hooks run before ordinary resources.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: migrate
    {{- include "sc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        {{- include "sc.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "sc.podCommon" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sc.secretName" . }}
                  key: MIGRATE_DATABASE_URL
            {{- include "sc.secretEnv" (dict "key" "APP_DB_PASSWORD" "secret" (include "sc.secretName" .)) | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{ toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
