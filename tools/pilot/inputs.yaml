# Pathways in a programme licence. Only the FIT pathway is built and simulated; the others are volumes for pricing, not claims.
pathways:
  blood_tests_per_year:
    value: 10000
    low: 5000
    high: 20000
    unit: blood-based colorectal screening tests a year, Abu Dhabi
    status: sourced-adjacent
    basis: "First-year target of about 10,000 people in the Abu Dhabi blood-based programme (Guardant announcement, 30 January 2025, via business-case.md section 1.1; The National, 15 December 2024). A target, not a count of tests done; low and high assumed."

  blood_test_positive_share:
    value: 0.12
    low: 0.10
    high: 0.15
    unit: share of blood-based tests that are positive and need a colonoscopy
    status: assumed
    basis: "Not read from a study. The test's published specificity for no advanced neoplasia is about 90 percent (ECLIPSE, NEJM 2024, to verify), so about a tenth of people without advanced neoplasia test positive; 12 percent allows for true positives."

  mammograms_per_year:
    value: 40000
    low: 25000
    high: 70000
    unit: screening mammograms a year, Abu Dhabi
    status: assumed
    basis: "5,983 mammograms in October 2025 alone (Gulf News, 14 October 2026), an awareness month, so the year is well below 12 times that. No annual count found; to verify with ADPHC."

  mammogram_recall_share:
    value: 0.08
    low: 0.05
    high: 0.12
    unit: share of screening mammograms recalled for assessment
    status: assumed
    basis: "Typical screening recall rates; no Abu Dhabi figure found. To verify against the DoH breast screening standard V2 (2025) KPIs."

  cervical_screens_per_year:
    value: 50000
    low: 30000
    high: 80000
    unit: cervical screening tests a year, Abu Dhabi
    status: assumed
    basis: "No count found; the DoH cervical screening standard V2 (October 2025) applies to all licensed providers. To verify with ADPHC."

  cervical_abnormal_share:
    value: 0.05
    low: 0.03
    high: 0.08
    unit: share of cervical screens needing colposcopy or repeat testing
    status: assumed
    basis: "Assumed; depends on HPV primary testing versus cytology. To verify."

# Price points (illustrative; not an offer).
pricing:
  price_per_closed_case_aed:
    value: 140
    unit: AED per case closed with evidence and a clinician signature
    status: assumed
    basis: "Illustrative. Paid only on a documented closure, so the buyer pays for the outcome of the work, not for a list. Compared with the per-tracked-case fee of AED 90 through the simulated closed share."

  programme_licence_aed_per_year:
    value: 2000000
    unit: AED per year, programme licence, four pathways, one emirate
    status: assumed
    basis: "Illustrative: FIT positives, blood-based positives, breast recall and cervical recall for one programme owner. Set near the operator's modelled cost plus a margin, not against any benchmark."

  implementation_fee_aed:
    value: 250000
    unit: AED one-off, paid by the buyer at go-live
    status: assumed
    basis: "Illustrative; covers part of the integration and pathway work. Not an offer."

  licence_pathways:
    value: 4
    unit: pathways covered by the licence
    status: assumed
    basis: "FIT, blood-based colorectal, breast recall, cervical recall."

# Operator cost to serve at programme scale (all assumed).
operator:
  support_fte_per_extra_pathway:
    value: 0.25
    unit: FTE per pathway beyond FIT
    status: assumed
    basis: "Configuration upkeep, feed monitoring and reporting for each extra pathway."

  clinical_safety_fte:
    value: 0.2
    unit: FTE, clinical safety officer
    status: assumed
    basis: "A named clinician who owns the hazard log and the safety case; the reviews ask for one."

  clinical_safety_loaded_cost_aed_per_year:
    value: 900000
    unit: AED per FTE per year
    status: assumed
    basis: "Consultant-level pay of about AED 75,000 a month (docs/evidence-wages.md section 4) times 12; on-costs not added."

  compliance_aed_per_year:
    value: 80000
    unit: AED per year
    status: assumed
    basis: "ADHICS audit support, penetration test and data protection review. Not a quote."

  provider_groups:
    value: 6
    unit: provider groups integrated at programme scale
    status: assumed
    basis: "The IFHAS delivery networks named publicly (SEHA, M42, NMC, Mediclinic, Burjeel) plus one for the rest; one feed per group. Integration cost per group is integration_one_off_aed_per_provider."

  pathway_build_one_off_aed:
    value: 150000
    unit: AED per new pathway, one-off
    status: assumed
    basis: "Pathway configuration, clinician review, Arabic review of templates, tests and the simulator run. Amortised over amortisation_years."

# Buyer-side values (all assumed unless stated).
buyer:
  coordinator_loaded_cost_aed_per_fte_year:
    value: 105000
    low: 85000
    high: 130000
    unit: AED per coordinator FTE per year, loaded
    status: assumed
    basis: "About AED 6,500 a month (docs/evidence-wages.md, sourced-adjacent) x 12 x 1.35 assumed on-costs = 105,300, rounded. The clinician and specialist costs are this times the wage ratios."
