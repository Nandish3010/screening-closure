# Continuous integration (F13, M6): the gates of `make check` split into jobs that run in parallel on GitHub-hosted runners.
# `unit` needs nothing but Python; `db` adds Postgres 16 (and HAPI FHIR when it starts); `web` runs the frontend tests, the
# production build and the Playwright suite against the mock adapter; `heavy` (manual and nightly) runs the slow
# regeneration checks. Not covered here (they need the whole compose stack): load-check, test-offline, test-demo, the live
# e2e; `.github/workflows/fresh-clone.yml` brings the stack up from a clean clone instead.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # nightly, runs the `heavy` job (and the others) on the default branch

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIAGE_ENABLED: "0" # the MLX triage model only exists on Apple silicon; the classifier answers "unavailable"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tracker-lint and the secrets scan read the git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the api image's Python
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Python environment (.venv, as the Makefile expects)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e './api[dev]'
      - name: make test (api unit and property tests, simulator tests)
        run: make test
      - name: make evaluate-check
        run: make evaluate-check
      - name: make docs-check
        run: make docs-check
      - name: make tracker-lint
        run: make tracker-lint
      - name: make test-security
        run: make test-security
      - name: make test-tools
        run: make test-tools
      - name: make review-packs-check
        run: make review-packs-check
      - name: make effort-check
        run: make effort-check

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: closure
          POSTGRES_PASSWORD: closure_dev_password
          POSTGRES_DB: closure
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U closure -d closure"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: closure_dev_password
      TEST_DATABASE_URL: postgresql://closure:closure_dev_password@localhost:5433/closure_test
      TEST_FHIR_URL: http://localhost:8080/fhir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e './api[dev]'
      - name: Create the closure_test and hapi databases
        run: |
          # The compose stack does this in docker/postgres-init; here it is the same script, run against the service container.
          psql -h localhost -p 5433 -U closure -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE closure_test OWNER closure" -c "CREATE DATABASE hapi OWNER closure"
      - name: Start HAPI FHIR (same image and settings as docker-compose.yml)
        run: |
          docker run -d --name hapi --network host \
            -e hapi.fhir.fhir_version=R4 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/hapi \
            -e SPRING_DATASOURCE_USERNAME=closure \
            -e SPRING_DATASOURCE_PASSWORD=closure_dev_password \
            -e SPRING_DATASOURCE_DRIVERCLASSNAME=org.postgresql.Driver \
            -e SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect \
            -e SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED=false \
            -e hapi.fhir.reuse_cached_search_results_millis=-1 \
            -e JAVA_TOOL_OPTIONS=-Xmx2g \
            hapiproject/hapi:v8.12.0-2
      - name: Wait for HAPI (at most 10 minutes; the HAPI tests skip cleanly without it)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null "$TEST_FHIR_URL/metadata"; then echo "HAPI up after about $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "::warning::HAPI did not answer within 10 minutes; its tests will skip"
      - name: make test-db
        run: make test-db SKIP_DB_CREATE=1
      - name: HAPI log tail
        if: always()
        run: docker logs --tail 30 hapi || true

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vite 8 and vitest 5 need Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: make web-test
        run: make -C .. web-test
      - name: make web-build
        run: make -C .. web-build
      - name: Playwright browser (chromium and its system libraries)
        run: npx playwright install --with-deps chromium
      - name: make web-e2e (mock adapter)
        run: make -C .. web-e2e
        env:
          E2E_PORT: "4173"
      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          if-no-files-found: ignore

  heavy:
    name: heavy
    runs-on: ubuntu-latest
    # Slow regeneration checks: manual runs and the nightly schedule only, never on push or pull_request.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e './api[dev]'
      - name: make sensitivity-check
        run: make sensitivity-check SENS_JOBS=$(nproc)
      - name: make risk-check
        run: make risk-check
