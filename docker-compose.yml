# Runs fully offline on a laptop. No external network calls at demo time.
name: screening-closure

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"  # host access for `make test-db` (5432 is often taken locally)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-closure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-closure}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `closure_test` database on a fresh volume (ADR-015).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [closure]

  # HAPI FHIR R4, stored in the shared postgres (database ${POSTGRES_DB}; HAPI's tables are hfj_*/trm_*/
  # etc. and do not collide with cases/events). It used to run on HAPI's default in-memory H2, but the
  # synthetic cohort (~1 GB of FHIR JSON for 300 patients) exhausts the JVM heap ("Out of memory" in H2).
  # Consequence: `make reset` (down -v) now wipes FHIR data together with the cases, keeping them consistent.
  fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-closure}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-closure}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-closure_dev_password}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      # Synthea patient bundles reach 20 MB each; the default container heap (~25% of RAM) is too small
      # to parse and process them in one transaction.
      JAVA_TOOL_OPTIONS: -Xmx3g
    depends_on:
      postgres:
        condition: service_healthy
    networks: [closure]

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PATHWAY_PATH: /config/pathways/colorectal_fit.yaml
      CALENDAR_PATH: /config/calendar.yaml
      # Set explicitly so a missing .env cannot silently fall back to the in-memory store.
      DATABASE_URL: postgresql://${POSTGRES_USER:-closure}:${POSTGRES_PASSWORD:-closure_dev_password}@postgres:5432/${POSTGRES_DB:-closure}
      # `close` needs an evidence_ref (DiagnosticReport/<id> or Procedure/<id>) that exists in HAPI (A15, ADR-021).
      FHIR_BASE_URL: http://fhir:8080/fhir
      FHIR_VERIFY_EVIDENCE: "true"
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [closure]

  scheduler:
    build: ./scheduler
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
      HEARTBEAT_PATH: /heartbeat/scheduler.json
    volumes:
      - heartbeat:/heartbeat
    depends_on:
      api:
        condition: service_healthy
    networks: [closure]

  watchdog:
    build: ./watchdog
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
      HEARTBEAT_PATH: /heartbeat/scheduler.json
    volumes:
      - heartbeat:/heartbeat:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [closure]

  # Synthetic cohort generator. Not started by `make up` (profile "tools"); run with `make synthea`.
  # The downloaded Synthea jar is untrusted input: it executes only inside this container, and
  # the only host path it can write is ./data (gitignored).
  synthea:
    image: eclipse-temurin:17-jre
    profiles: [tools]
    entrypoint: ["/bin/sh", "/tools/run.sh"]
    environment:
      SYNTHEA_VERSION: ${SYNTHEA_VERSION:-v3.3.0}
      SYNTHEA_SEED: ${SYNTHEA_SEED:-20261017}
      SYNTHEA_POPULATION: ${SYNTHEA_POPULATION:-300}
      SYNTHEA_REFERENCE_DATE: ${SYNTHEA_REFERENCE_DATE:-20260105}
    volumes:
      - ./data:/data
      - ./tools/synthea:/tools:ro

volumes:
  pgdata:
  heartbeat:

networks:
  closure:
