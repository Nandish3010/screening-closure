# The local stand-in for an OIDC provider's key endpoint. The API (AUTH_MODE=oidc, APP_ENV=production) only ever FETCHES
# the issuer's signing keys (JWKS) and verifies RS256 tokens against them; it never talks to the issuer otherwise. So this
# serves the public JWKS (ConfigMap sc-jwks, generated by up.sh) with python's http.server from the api image already
# loaded in the cluster (no extra image). The matching private key is the Secret sc-oidc-signing; tools/k8s/mint_token.py
# signs tokens with it. The pod deliberately has no `app.kubernetes.io/instance` label, so the chart's default-deny does not apply to it.
apiVersion: apps/v1
kind: Deployment
metadata: { name: sc-jwks, namespace: closure, labels: { app: sc-jwks } }
spec:
  replicas: 1
  selector: { matchLabels: { app: sc-jwks } }
  template:
    metadata: { labels: { app: sc-jwks } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: jwks
          image: screening-closure-api:m76
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080", "--directory", "/jwks", "--bind", "0.0.0.0"]
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          readinessProbe: { httpGet: { path: /jwks.json, port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: jwks, mountPath: /jwks, readOnly: true }]
      volumes:
        - { name: jwks, configMap: { name: sc-jwks } }
---
apiVersion: v1
kind: Service
metadata: { name: sc-jwks, namespace: closure, labels: { app: sc-jwks } }
spec:
  selector: { app: sc-jwks }
  ports: [{ name: http, port: 8080, targetPort: http }]
