apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    {{- include "sc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        {{- include "sc.labels" . | nindent 8 }}
      annotations:
        {{- toYaml (default (dict) .Values.podAnnotations) | nindent 8 }}
    spec:
      {{- include "sc.podCommon" . | nindent 6 }}
      {{- if .Values.api.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          {{- if or (gt (int .Values.api.server.workers) 1) (gt (int .Values.api.server.limitMaxRequests) 0) }}
          # M7-8: a non-default uvicorn process (more workers, or workers recycled after N requests); the image's own CMD otherwise.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--workers", "{{ int .Values.api.server.workers }}"{{ if gt (int .Values.api.server.limitMaxRequests) 0 }}, "--limit-max-requests", "{{ int .Values.api.server.limitMaxRequests }}"{{ end }}]
          {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          env:
            {{- include "sc.apiEnv" . | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.api.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "sc.configVolume" . | nindent 8 }}
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    {{- include "sc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and .Values.api.service.nodePort (eq .Values.api.service.type "NodePort") }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    {{- include "sc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    {{- include "sc.labels" . | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.api.ingress.className }}
  ingressClassName: {{ .Values.api.ingress.className }}
  {{- end }}
  {{- if .Values.api.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.api.ingress.host | quote }}]
      secretName: {{ .Values.api.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          # /metrics is deliberately not exposed through the ingress: Prometheus reaches the Service inside the cluster.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port: { name: http }
{{- end }}
