# E16: the shot list for the 3-minute submission video and the backup demo video.
#
# Derived from the "Backup video storyboard (3 minutes)" table in docs/submission/demo-script.md (shots 1 to 14, same
# two beats, same captions: the catch (shots 3 to 6), then the reveal (shots 7 to 11), then the numbers (12, 13) and the ask (14)) and
# driven against the LIVE stack (http adapter) after `make demo-reset` and `make demo-scenario UNTIL=owner_accepted`.
# Read by tools/video/storyboard.py (validation, `make video-check`), tools/video/record.ts (Playwright) and
# tools/video/narrate.py (text to speech). tests/test_demo_docs.py keeps this file and the demo script in step.
#
# Every shot has: id, title, beat (the live beat of the demo script), route, actions, caption, narration, duration (the
# target in seconds), and optionally submission: true (in the 3-minute video; every shot is in the backup video) and
# optional: true (skipped, not failed, when its route is absent or its guard element never shows up).
#
# Targets: the 14 shots add up to 170 s, which with the 3 s title card and the 4 s end card is 177 s, inside the 180 s
# cap (3 s under it, so check the real length; narration is estimated at about 2.8 words a second plus 0.8 s a shot, and no shot's narration is longer than its target). The final length of a shot is max(narration length, target); `make video-check` checks the targets, `assemble.sh`
# checks the real lengths.
#
# Actions (one key per step):
#   goto: /path                      open a route in the app ({case} = the named patient's case, {case2} = the prepared second case)
#   role: owner|coordinator|supervisor|specialist|clinician|patient    the header's Switch role
#   click: {name: "Button text"} | {link: "Link text"} | {testid: id} | {row: "text in a worklist row"}
#   select: {label: "Field label", value: "option label or value"} | {testid: id, value: ...}
#   fill: {label: "Field label", value: "text"}
#   scroll: {testid: id} | {text: "visible text"} | {heading: "Heading"}      scrolls the element into the middle of the screen
#   wait_for: {testid|text|heading: ..., contains: "text", absent: true, timeout: ms, reload_every: ms}
#   (shot 10 needs `make triage-serve` running on the host: it waits for "Read as confirm", so it fails loudly without it)
#   hold: seconds                    let the viewer read
#   caption: "text"                  change the on-screen caption from here on
#   cut: start | end                 the video between the two markers is removed (dead waiting); the shot keeps its caption
#   shell: "command"                 run in the repository root (not shown)
#   terminal: {command, run: true, timeout: s, reuse: key, lines: n}   run a command and show it in a terminal page
#   card: {kind: stat|text|results|slide, ...}                         a full-screen page rendered by the tool
#   advance_clock: days              supervisor only: the header's Advance clock (days) control, then the badge changes

meta:
  width: 1280
  height: 800
  voice: Samantha       # macOS `say`; en_US, clear. Daniel (en_GB) also works.
  rate: 185             # words per minute for `say -r`
  submission_cap_seconds: 180

cards:
  title:
    seconds: 3
    heading: Screening Closure
    line: Every actionable screening result has a named owner, a clock, an audit trail, and a clinician-signed closure. Nothing is diagnosed.
    note: All data synthetic
  end:
    seconds: 4
    heading: Screening Closure
    line: "Repository: [repository link: to be added at submission]"
    team: "[Team name]"
    note: "All data synthetic. Narration is synthetic text-to-speech."

shots:
  - id: 1
    title: The problem
    beat: Problem
    submission: true
    route: "card:stat"
    duration: 8
    caption: "Abu Dhabi audit: 30.5% of positive screening tests ever reached a colonoscopy (BMC Cancer 2021)"
    narration: "An Abu Dhabi audit found that only thirty point five percent of positive bowel screening tests ever reached a colonoscopy."
    actions:
      - card: {kind: stat, value: "30.5%", text: "of positive screening tests in an Abu Dhabi audit ever had the follow-up colonoscopy", source: "Almansoori et al., BMC Cancer 2021"}
      - hold: 6

  - id: 2
    title: What this is
    beat: What this is
    submission: true
    route: /coordinator
    duration: 9
    caption: "A named owner, a clock, an audit trail, a clinician-signed closure. Nothing is diagnosed. All data synthetic."
    narration: "An accountability and closure engine: a named owner, a clock, an audit trail and a clinician's signature on every closure. Nothing is diagnosed."
    actions:
      - goto: /coordinator
      - wait_for: {testid: worklist-row, timeout: 20000}
      - hold: 5

  - id: 3
    title: An owned case, an honest banner, the scheduler stopped
    beat: "Catch 1, 2. Owned case, banner, kill the scheduler"
    submission: true
    route: "/coordinator/{case}"
    duration: 14
    caption: "The system named the owner and sent the first message by itself (mock only: nothing reaches a phone). Amber: no clinician has signed those messages off, so the demo runs on a placeholder. We stop the scheduler on purpose."
    narration: "A positive result has a named owner, assigned by the system. Its first message is mock-only: nothing reaches a phone. The amber banner says no clinician has signed the messages off. Now we stop the scheduler on purpose."
    actions:
      - goto: "/coordinator/{case}"
      - wait_for: {heading: "Owner accepted", timeout: 20000}
      - wait_for: {testid: outreach-demo-banner, timeout: 20000}
      - hold: 2
      - scroll: {heading: "Timeline"}
      - hold: 2
      - terminal: {command: "docker compose stop scheduler", run: true, timeout: 60}
      - hold: 1

  - id: 4
    title: Patient contacted, clock jump
    beat: "Catch 3, 4. Patient contacted, clock jump"
    submission: true
    route: "/coordinator/{case}"
    duration: 10
    caption: "No answer from the patient. Eleven working days pass. Nothing is flagged: this is silence."
    narration: "The owner phones the patient, who does not answer. Eleven working days pass. Nothing is flagged, because the clock that flags it is dead."
    actions:
      - goto: "/coordinator/{case}"
      - role: clinician
      - wait_for: {testid: contact-patient, timeout: 20000}
      - click: {testid: contact-patient}
      - wait_for: {testid: flash, contains: "Patient contact recorded", timeout: 20000}
      - hold: 1
      - role: supervisor
      - wait_for: {testid: clock-control, timeout: 20000}
      - advance_clock: 15
      - hold: 1
      - scroll: {testid: sla-clock}
      - hold: 3

  - id: 5
    title: Watchdog catches the dead scheduler
    beat: "Catch 5, 6. Watchdog, restart"
    submission: true
    route: "terminal, /dashboard, /coordinator/{case}"
    duration: 16
    caption: "The watchdog caught the dead scheduler. Restarted: the overdue flag, the reminder and the supervisor escalation appear, once each, in order. The reminder to the patient is mock-only."
    narration: "A property test fills the wait: two thousand random sequences, none closes without evidence. Then the banner: the scheduler is down. Restart it, and the overdue flag, the reminder and the escalation appear once each, in order. Reminders are mock-only."
    actions:
      # The alert is due 60 to 80 s after the stop in shot 3; the test fills part of the wait.
      - terminal: {command: ".venv/bin/pytest -q \"api/tests/test_state_machine.py::test_never_closed_without_evidence_and_human_signoff\"", run: true, timeout: 180, reuse: property-test, lines: 14}
      - hold: 3
      - goto: /dashboard
      - cut: start
      - wait_for: {testid: scheduler-banner, timeout: 150000}
      - cut: end
      - hold: 3
      - shell: "docker compose start scheduler"
      - cut: start
      - wait_for: {testid: scheduler-banner, absent: true, timeout: 120000}
      - cut: end
      - wait_for: {testid: scheduler-recovered, timeout: 20000}
      - hold: 2
      - goto: "/coordinator/{case}"
      - cut: start
      - wait_for: {testid: escalation-level, contains: "Level", timeout: 90000, reload_every: 5000}
      - cut: end
      - scroll: {testid: escalation-level}
      - hold: 3

  - id: 6
    title: Escalation accepted
    beat: "Catch 7. Escalation accepted"
    submission: true
    route: "/coordinator/{case}"
    duration: 5
    caption: "Every escalation needs a human to accept it"
    narration: "Every escalation needs a human to accept it."
    actions:
      - goto: "/coordinator/{case}"
      - role: supervisor
      - wait_for: {testid: pending-escalation, timeout: 20000}
      - scroll: {testid: pending-escalation}
      - hold: 1
      - click: {testid: accept-escalation}
      - wait_for: {testid: flash, contains: "Escalation accepted", timeout: 20000}
      - hold: 2

  - id: 7
    title: The prepared second case, a bad reference refused
    beat: "Reveal 1. Second case, bad evidence refused"
    submission: true
    route: "/coordinator/{case2}"
    duration: 9
    caption: "A reference that does not exist is refused. Closure needs evidence that exists."
    narration: "A second case, prepared earlier, already has its colonoscopy. Closure needs evidence that exists, so a made-up reference is refused."
    actions:
      - goto: "/coordinator/{case2}"
      - role: specialist
      - wait_for: {heading: "Confirmatory completed", timeout: 20000}
      - hold: 2
      - scroll: {text: "Clinician sign-off and closure"}
      - fill: {label: "Evidence reference", value: "Procedure/colonoscopy-0001"}
      - click: {testid: signoff}
      - wait_for: {text: "refused", timeout: 20000}
      - hold: 3

  - id: 8
    title: "The agency: the morning's work, one decision in the inbox"
    beat: "Reveal 2. Agency, run, inbox"
    submission: true
    route: /agency
    duration: 12
    caption: "Agents do the labour, never the authority. One run reads all 22 open cases; the inbox holds only the human decision."
    narration: "Behind the worklist, agents prepare the work for every open case: overdue cases explained, evidence found, the closure pack assembled. The inbox holds only the human decision."
    actions:
      # The run is started from a terminal (the supervisor's dev-login is inside the script), so the video needs no extra role switch.
      - terminal: {command: "make agency-run", run: true, timeout: 120, lines: 14}
      - hold: 3
      - goto: /agency
      - role: specialist
      - wait_for: {testid: inbox-item, timeout: 30000}
      - scroll: {heading: "Sign the closure"}
      - hold: 3

  - id: 9
    title: Signed and closed
    beat: "Reveal 3. Real evidence, the clinician's own signature, closed"
    submission: true
    route: "/coordinator/{case2}"
    duration: 12
    caption: "The real Procedure and the clinician's own signature: closed. A record that says the colonoscopy was incomplete is refused."
    narration: "The clinician opens it from the inbox, records the real procedure, signs as themselves, and the case closes. A record that says the colonoscopy was incomplete would be refused."
    actions:
      # Each shot is its own browser context: open the agency page again (the role, specialist, is kept from shot 8)
      - goto: /agency
      - role: specialist
      - wait_for: {testid: inbox-item, timeout: 30000}
      - click: {link: "Open case"}
      - wait_for: {heading: "Clinician reviewed", timeout: 20000}
      - scroll: {text: "Clinician sign-off and closure"}
      - click: {testid: record-colonoscopy}
      - hold: 2
      - click: {testid: signoff}
      - wait_for: {heading: "Closed", timeout: 30000}
      - wait_for: {text: "Case closed (signed)", timeout: 10000}
      - scroll: {text: "Case closed (signed)"}
      - hold: 2
      - scroll: {testid: reopen-panel}
      - hold: 2

  - id: 10
    title: Triage cameo
    beat: "Reveal 5. A Gulf-Arabic reply, read live"
    submission: true
    route: "/coordinator/{case}"
    duration: 17
    caption: "A reply in Gulf Arabic, read live by an offline model: a clear confirmation needs no person. An opt-out is caught by a keyword rule first and always goes to a person. It can flag, never close, send or change consent. No appointment is booked: the FHIR Appointment is a stub."
    narration: "A patient replies in Gulf Arabic that she will come on Sunday. An offline model on this laptop reads a confirmation; no person is needed. An opt-out goes to a keyword rule, then a person. No appointment is booked: that record is a stub."
    actions:
      - goto: "/coordinator/{case}"
      - role: coordinator
      - scroll: {testid: reply-panel}
      - select: {testid: reply-channel, value: whatsapp}
      - fill: {label: "Patient's reply", value: "ان شاء الله بجي يوم الأحد"}
      - hold: 1
      - click: {testid: record-reply}
      - wait_for: {testid: reply-result, contains: "Read as confirm", timeout: 30000}
      - scroll: {testid: reply-result}
      - hold: 5

  - id: 11
    title: The patient's own screen, in Arabic
    beat: "Reveal 6. The patient's view, right to left"
    submission: true
    route: "/patient/{case}"
    duration: 11
    caption: "The patient's own screen, in Arabic and right to left: the result in plain words, who owns the case, one button to say she understood."
    narration: "This is what the patient sees, in Arabic, right to left: the result in plain words, who owns her case, and one button to say she understood."
    actions:
      # The page opens in English; the language button (its name contains the word for Arabic) flips it to Arabic, right to left.
      - goto: "/patient/{case}"
      - role: patient
      - wait_for: {testid: patient-owner, timeout: 20000}
      - hold: 2
      - click: {name: "العربية"}
      - hold: 1
      - scroll: {testid: patient-owner}
      - hold: 4

  - id: 12
    title: Numbers
    beat: Numbers
    submission: true
    route: "card:results"
    duration: 21
    caption: "Simulation on synthetic data, literature-anchored, before capacity limits, against a US-calibrated usual-care baseline. Colonoscopy within 180 days 51% to 67%, a ratio of about 1.31, calibrated to published navigation trials: the model shows the mechanism, not new evidence of effect. Closed with evidence and a signature 53% to 68%. Lost without anyone told, programme-level 45% to 21%; 0% among the cases the programme reaches, true by construction. Rerun: make evaluate"
    narration: "Synthetic simulation, US-calibrated baseline. Colonoscopy within one hundred eighty days: fifty-one to sixty-seven, a ratio of one point three one, calibrated to published trials. Closed with evidence: fifty-three to sixty-eight. Lost without anyone told: forty-five to twenty-one percent programme-wide; zero among cases reached, by construction."
    actions:
      - card:
          kind: results
          source: docs/results/results.md
          columns: ["Baseline", "Orchestrated, literature anchored"]
          rows:
            - "Colonoscopy completed within 180 days"
            - "Cases closed (evidence and human sign-off)"
            - "Lost AND never surfaced to a human: programme level"
            - "Lost AND never surfaced to a human: in reach"
      - hold: 18

  - id: 13
    title: Labour
    beat: Numbers
    submission: true
    route: "card:slide"
    duration: 10
    caption: "Labour: 37% fewer staff minutes per case the system handles, 20% across the programme. The 40% target is not met in realistic scenarios; only the upper bound, a mechanism ceiling, crosses it."
    narration: "Labour falls thirty-seven percent per handled case, twenty percent programme-wide. The forty percent target is not met in realistic scenarios; only the upper bound does."
    actions:
      - card:
          kind: slide
          heading: "Labour, in the same simulation"
          bullets:
            - "37% fewer staff minutes per case the system handles (in reach)"
            - "20% fewer across the whole programme (0.55 reach assumption)"
            - "The 40% target is not met in realistic scenarios; only the upper bound (a mechanism ceiling) crosses it"
            - "Minutes are published or assumed; synthetic"
      - hold: 8

  - id: 14
    title: The ask
    beat: Ask
    submission: true
    route: "card:slide"
    duration: 16
    caption: "Pilot ask: one programme, two providers, 90 days, shadow mode first. Cases closed without evidence: must stay zero. Buyer hypothesis: a programme licence across pathways; about 24 to 54 advanced cancers avoided a year in Abu Dhabi (synthetic, assumption-based)."
    narration: "The ask: one programme, two providers, ninety days, shadow mode first. Cases closed without evidence must stay zero. Who pays: a programme licence; Abu Dhabi's public health programme is the hypothesised buyer. Replay it with the Judge tour."
    actions:
      - card:
          kind: slide
          heading: "Pilot ask"
          bullets:
            - "One programme: colorectal screening"
            - "Two providers"
            - "Ninety days, shadow mode first: 30 days watching, nothing sent"
            - "Cases closed without evidence: must stay at zero. If it moves, we stop"
            - "Who pays (hypothesis, not a relationship): a programme licence across pathways, Abu Dhabi public health programme as buyer"
            - "About 24 to 54 advanced cancers avoided a year in Abu Dhabi: synthetic, assumption-based"
            - "Judges: the Judge tour button (header) replays this, read-only"
      - hold: 11

  # ---- Backup-only extra: not in the 3-minute cut. Skipped, not failed, if the element is absent. ------------------------
  - id: 15
    title: The effort counter on a case
    beat: Effort counter (A21)
    optional: true
    submission: false
    route: "/coordinator/{case2}"
    # The counter is on the staff case page only (a patient's redacted case JSON carries no effort), and the role from shot 11
    # (patient) persists in localStorage, so the route is probed here and the role is set in the actions before waiting for it.
    requires: {route: "/coordinator/{case2}"}
    duration: 10
    caption: "Human actions against automated actions on every case. Minutes saved are assumed, not measured."
    narration: "Every case shows its human actions against its automated actions, with the minutes saved. The minutes are assumed, not measured."
    actions:
      - goto: "/coordinator/{case2}"
      - role: coordinator
      - wait_for: {testid: effort-counter, timeout: 8000}
      - scroll: {testid: effort-counter}
      - hold: 8
