# Inputs for tools/pilot/cost_model.py.
#
# EVERY value here is an assumption chosen to show the shape of the cost curve, with one exception: the three
# wage ratios (wage_ratio_*), which are "sourced-adjacent" (docs/evidence-wages.md section 4: published
# recruiter and aggregator salary pages for the right roles in the right country, no official pay scale).
# None comes from a quote, a contract, a published price list or pilot data. Replace each assumed value with a
# sourced figure (and change its status) before any number from this model is used in a commercial conversation.
#
# Format: a small YAML subset (nested mappings, scalars, inline lists, # comments) read by the script's own
# parser, so no third-party package is needed. Currency is AED. Each input has: value, unit, status, basis.
# status must be "assumed", "sourced-adjacent" (a published figure for a related task, setting or population,
# the grade the simulator's effort table also uses) or "sourced"; the script refuses an input with no status.
# The wage ratios also carry "low" and "high" fields (the sensitivity range the wage-weighted section prints).

currency: AED

scenarios:
  screened_members_per_year: [10000, 50000, 200000]

inputs:
  positivity_rate:
    value: 0.07
    unit: share of screened members with a positive FIT
    status: assumed
    basis: Same value as simulator/params.yaml fit_positivity_rate (assumed there too; published ranges around 5-8 percent are to verify in docs/evidence.md).

  hosting_fixed_aed_per_month:
    value: 9000
    unit: AED per month
    status: assumed
    basis: In-country hosting of the full stack with a standby copy (database, API, scheduler, watchdog, FHIR server, web). Not a quote.

  hosting_variable_aed_per_1000_cases_per_year:
    value: 400
    unit: AED per 1,000 actionable cases per year
    status: assumed
    basis: Storage and compute growth with case volume. Not a quote.

  third_party_licences_aed_per_year:
    value: 24000
    unit: AED per year
    status: assumed
    basis: Monitoring, backup and logging tools. Excludes our own product fee, which is modelled separately under pricing.

  support_fte_base:
    value: 0.5
    unit: FTE
    status: assumed
    basis: Operations, on-call and release support needed at any volume.

  support_fte_per_50k_members:
    value: 0.25
    unit: FTE per 50,000 screened members per year
    status: assumed
    basis: Extra support as volume and provider count grow.

  support_fte_loaded_cost_aed_per_year:
    value: 300000
    unit: AED per FTE per year
    status: assumed
    basis: Fully loaded engineer or support analyst cost.

  integration_one_off_aed_per_provider:
    value: 120000
    unit: AED per participating provider, one-off
    status: assumed
    basis: Data feed build and test, role set-up, training, and local security assessment support.

  members_per_provider:
    value: 20000
    unit: screened members per year per provider
    status: assumed
    basis: Used only to estimate how many providers a given volume implies.

  amortisation_years:
    value: 3
    unit: years
    status: assumed
    basis: Period over which the one-off integration cost is spread.

  coordinator_minutes_per_case_manual:
    value: 57.3
    unit: staff minutes (all roles) per actionable case without the engine
    status: assumed
    basis: "Source: docs/results/results.json effort, baseline arm, human minutes per case (57.3; coordinator 46.8, owner clinician 4.4, specialist 6.1), as in docs/results/results.md Human effort, make evaluate on the merged tree, 18 October 2026. Synthetic simulator output; the minutes come from published time studies (66 percent of baseline minutes, sourced-adjacent) and assumptions (34 percent), so the blend is graded assumed, the weaker of the two. All roles are valued at the coordinator rate below, which understates clinician and specialist time; the script's wage-weighted section applies the wage ratios. To be measured in the pilot shadow period (K9)."

  coordinator_minutes_per_case_with_engine:
    value: 46.8
    unit: staff minutes (all roles) per actionable case with the engine
    status: assumed
    basis: "Source: docs/results/results.json effort, literature-anchored orchestrated arm at programme level (46.8 minutes, 18.3 percent fewer than baseline, 0.55 reach); 38.2 among the cases the programme reaches (33.4 percent fewer); the upper range is 36.0 (37.3 percent fewer). Synthetic; blend graded assumed as above. Coordinator minutes fall (-35.2 percent) but owner-clinician (+109.2 percent) and specialist (+19.5 percent) minutes rise, so valuing all roles at the coordinator rate overstates the saving: at the sourced-adjacent wage ratios (clinician 4, specialist 10, below) weighted staff time per case is higher than at baseline, not lower (see the wage-weighted section of the script output). To be measured in the pilot (K9)."

  coordinator_cost_aed_per_hour:
    value: 120
    unit: AED per hour
    status: assumed
    basis: Loaded cost of a screening or referral coordinator. The 120 is an assumption and looks high against the pay band in docs/evidence-wages.md section 5 (about AED 55 to 75 per hour loaded for a coordinator at about AED 6,500 a month, unless the model's coordinator is a nurse-coordinator); not re-estimated here. The wage ratios below are used only by the wage-weighted section of the script, which reports coordinator-equivalent minutes and does not convert them to AED.

  wage_ratio_nurse:
    value: 1.5
    low: 1.2
    high: 2.2
    unit: multiple of the coordinator wage, registered nurse
    status: sourced-adjacent
    basis: docs/evidence-wages.md section 4 (nurse 1.5; sensitivity range 1.2 to 2.2). Median monthly pay about AED 10,000 against about 6,500 for a coordinator, from recruiter and aggregator pages, not an official scale. Read and printed by the script but not applied, because the simulator has no nurse role (the planned routing of escalations to nurse navigators is not modelled; a navigator proxy of 2.0 is in the evidence note).

  wage_ratio_clinician:
    value: 4.0
    low: 3.0
    high: 6.0
    unit: multiple of the coordinator wage, GP or owner physician
    status: sourced-adjacent
    basis: docs/evidence-wages.md section 4 (clinician 4.0; sensitivity range 3 to 6). Median GP pay about AED 26,500 a month against about 6,500; replaces the earlier assumed 3. Recruiter and aggregator pages, not an official scale; the coordinator wage is the weakest figure and every ratio divides by it.

  wage_ratio_specialist:
    value: 10.0
    low: 8.0
    high: 15.0
    unit: multiple of the coordinator wage, consultant gastroenterologist
    status: sourced-adjacent
    basis: docs/evidence-wages.md section 4 (specialist 10.0; sensitivity range 8 to 15). Median consultant pay about AED 75,000 a month gives 11.5; rounded down to 10 because Abu Dhabi consultant bands sit below the Dubai-weighted adverts. Replaces the earlier assumed 4. Recruiter and aggregator pages, not an official scale.

  price_per_screened_member_per_year_aed:
    value: 6.0
    unit: AED per screened member per year
    status: assumed
    basis: Illustrative fee for commercial option A. Not an offer.

  price_per_actionable_case_aed:
    value: 90
    unit: AED per actionable (FIT-positive) case
    status: assumed
    basis: Illustrative fee for commercial option B. Not an offer.

pilot:
  pilot_providers:
    value: 3
    unit: providers
    status: assumed
    basis: Pilot plan asks for two to three providers; the upper end is used.

  pilot_fit_screened_per_provider_per_year:
    value: 3000
    unit: FIT results per provider per year
    status: assumed
    basis: Placeholder until providers supply their real volumes (a data request in the pilot plan).

  pilot_days:
    value: 90
    unit: days
    status: assumed
    basis: Enrolment window of the pilot (30 days shadow, 60 days active).

  followup_tail_days:
    value: 90
    unit: days
    status: assumed
    basis: Follow-up after the last enrolment so cases can reach closure and be measured. A decision of this plan, not part of the original brief.

  pilot_support_fte:
    value: 1.0
    unit: FTE during the enrolment window
    status: assumed
    basis: Pilot manager and engineer support.

  tail_support_fte:
    value: 0.25
    unit: FTE during the follow-up tail
    status: assumed
    basis: Monitoring and reporting only.

  pilot_governance_review_one_off_aed:
    value: 60000
    unit: AED, one-off
    status: assumed
    basis: Clinical safety review, security assessment, legal review of data agreements.

# Shadow-only pilot: the engine reads a periodic flat-file (CSV) or HL7 v2 export of FIT results, referrals and
# colonoscopy records instead of a full integration, computes owners, clocks, overdue flags and escalation
# suggestions, and sends and assigns nothing. Coordinators review the flags weekly. These inputs are assumptions
# chosen to be plausible relative to the full-pilot inputs above; none is a quote. The model also reuses
# pilot_providers, pilot_fit_screened_per_provider_per_year, positivity_rate, the hosting inputs, the licence
# input and support_fte_loaded_cost_aed_per_year.
shadow_pilot:
  shadow_integration_one_off_aed_per_provider:
    value: 15000
    unit: AED per participating provider, one-off
    status: assumed
    basis: Mapping and validating one periodic export (flat file or HL7 v2) per provider; no live interface, no outbound channel, no role set-up for messaging. Much lower than the 120,000 for a full integration. Not a quote.

  shadow_days:
    value: 90
    unit: days
    status: assumed
    basis: Length of the shadow-only run. Cases are not followed to closure by the engine, so no follow-up tail is funded.

  shadow_support_fte:
    value: 0.3
    unit: FTE during the shadow run
    status: assumed
    basis: Loading and checking the periodic export, tuning flags and a weekly review with the coordinator. Lower than the 1.0 FTE of the full pilot because nothing is sent or assigned.

  shadow_governance_review_one_off_aed:
    value: 25000
    unit: AED, one-off
    status: assumed
    basis: Data sharing agreement and security assessment for a read-only export; no clinical safety review of outbound wording. Lower than the 60,000 of the full pilot.

  shadow_hosting_share_of_full:
    value: 0.4
    unit: share of the full-stack hosting cost
    status: assumed
    basis: A single copy without a standby, and no messaging or web channel. Applied to both the fixed and the variable hosting inputs.

  shadow_licences_share_of_full:
    value: 0.5
    unit: share of the third-party licence cost
    status: assumed
    basis: Monitoring, backup and logging for a smaller footprint.

# Value side (illustrative only): the simulated shares of cases with no colonoscopy by day 270 are READ from
# docs/results/results.json by the script (they are synthetic outputs, not inputs here); these inputs turn a
# shift in that share into cancers using published odds ratios from Corley et al., JAMA 2017 (docs/evidence.md
# section 9). Observational odds ratios, applied to a different population, so every value is assumed here.
value:
  crc_risk_on_time:
    value: 0.030
    unit: risk, any CRC, colonoscopy at 8-30 days
    status: assumed
    basis: Corley 2017 any CRC at 8-30 days (docs/evidence.md section 9). Applied to a different population, so assumed here.

  advanced_stage_risk_on_time:
    value: 0.008
    unit: risk, advanced stage, colonoscopy at 8-30 days
    status: assumed
    basis: Placeholder, to verify against Corley 2017 (not recorded in docs/evidence.md).

  or_any_crc_10_to_12_months:
    value: 1.48
    unit: odds ratio, any CRC, 10-12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the lower illustrative case. Observational, confounding by indication.

  or_advanced_stage_10_to_12_months:
    value: 1.97
    unit: odds ratio, advanced stage, 10-12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the lower illustrative case.

  or_any_crc_over_12_months:
    value: 2.25
    unit: odds ratio, any CRC, over 12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the higher illustrative case.

  or_advanced_stage_over_12_months:
    value: 3.22
    unit: odds ratio, advanced stage, over 12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the higher illustrative case.

# ---------------------------------------------------------------------------------------------------------
# Commercial-case extension (ticket E17, docs/commercial/business-case.md). These sections are read only when
# the script runs with --commercial; the default output is unchanged. Statuses are graded honestly: a figure
# read from a published page for a different setting or year is "sourced-adjacent"; a derived or chosen figure is
# "assumed". Currency conversions: the dirham peg is a fixed public rate; other conversions use the paper's own rate.
# ---------------------------------------------------------------------------------------------------------

# Market sizing (docs/commercial/business-case.md section 1).
market:
  abu_dhabi_population_40_to_75:
    value: 1264000
    unit: residents aged 40 to 75, Abu Dhabi emirate, 2024
    status: sourced-adjacent
    basis: "Statistics Centre Abu Dhabi 2024 estimate as reproduced by citypopulation.de (https://www.citypopulation.de/en/uae/abudhabi/admin/): 40-49 811,235; 50-59 333,260; 60-69 101,990; 70-79 29,995. Ages 70 to 74 taken as 60 percent of the 70-79 band (about 18,000; the split is assumed). Sum 1,264,485. Third-party reproduction of the SCAD table; the SCAD portal itself could not be read. To verify at census.scad.gov.ae."

  uae_population_40_to_75:
    value: 3200000
    unit: residents aged 40 to 75, UAE, about 2024
    status: assumed
    basis: "No UAE age table could be read (the FCSC open-data table returned HTTP 403). Scaled from the Abu Dhabi share of 30.6 percent of residents aged 40 to 75 applied to the 2024 UAE total of about 11.03 million (UN World Population Prospects 2024 via populationpyramid.net), then rounded down because Abu Dhabi skews older than Dubai (Dubai 35 to 59 is 37.1 percent, DHA yearbook 2024). To verify against the FCSC table UAE population estimates by gender, age group and year."

  fit_participation_annual:
    value: 0.20
    low: 0.10
    high: 0.35
    unit: share of the eligible population with a FIT result in a year
    status: assumed
    basis: "Evidence for the level: 23.5 percent of 45,147 eligible Emirati nationals screened by FIT or gFOBT in 2015-2016 (BMC Cancer 2021, PMC8343888); regular screening below 20 percent in the general population (The National, 15 December 2024); 88 percent of over-40s in a UAE survey never screened (Khaleej Times, 9 March 2022, sponsor Sheikh Shakhbout Medical City). The high end is a programme target, not an observation. FIT is only one of three tests offered, so the FIT share is lower than overall screening."

  fit_positivity_market:
    value: 0.07
    low: 0.065
    high: 0.135
    unit: share of FIT results that are positive
    status: sourced-adjacent
    basis: "Gulf programmes: Qatar 6.8 percent (758 of 11,130, PMC9822526); Saudi Ministry of Health pilot 6.6 percent and Al-Kharj 6.3 percent (PMC11161890); Bahrain 716 of 11,000, 6.5 percent (MDPI Gastrointestinal Disorders 2024). Abu Dhabi ambulatory clinics 2015-2016 reported 13.5 percent among screened Emirati nationals (PMC8343888), used as the high end. Central 0.07 matches positivity_rate above."

  saudi_population_45_to_75:
    value: 5500000
    unit: residents aged 45 to 75, Saudi Arabia, 2022
    status: sourced-adjacent
    basis: "GASTAT census 2022 as reproduced by the Gulf Labour Markets and Migration programme (gulfmigration.grc.net, series total population by age group adjusted by census 2022): 45-64 4,856,423 and 65 and over 861,849. Ages 65 to 75 taken as 80 percent of the 65-plus band (assumed). Sum 5,545,902, rounded."

  qatar_population_total:
    value: 3143491
    unit: residents, Qatar, 2024
    status: sourced-adjacent
    basis: "Gulf Labour Markets and Migration programme series, from the Planning and Statistics Authority (gulfmigration.grc.net, Qatar estimates of total population 1986-2024). No age table was read."

  kuwait_population_total:
    value: 4987826
    unit: residents, Kuwait, December 2024
    status: sourced-adjacent
    basis: "PACI figure as reported by Gulf News (4,987,826; 1,567,983 Kuwaiti). The Gulf Labour Markets series gives 4,881,254; the gap is unexplained. No age table was read."

  oman_population_total:
    value: 5268072
    unit: residents, Oman, December 2024
    status: sourced-adjacent
    basis: "NCSI year-end 2024 figure as reported by Muscat Daily (5,268,072; Omani 56.68 percent). No age table was read."

  bahrain_population_total:
    value: 1594654
    unit: residents, Bahrain, December 2024
    status: sourced-adjacent
    basis: "Information and eGovernment Authority series via gulfmigration.grc.net (1,594,654; 742,234 Bahraini). No age table was read."

  gcc_eligible_share_of_population:
    value: 0.15
    low: 0.12
    high: 0.18
    unit: share of total residents in the screening age range, four smaller GCC states
    status: assumed
    basis: "Saudi Arabia implies 17 percent (5.5 million of 32.2 million, census 2022). Applied to Qatar, Kuwait, Oman and Bahrain without an age table; Gulf expatriate-heavy populations are younger, so 15 percent is chosen. To verify against each statistics office."

  gcc_fit_participation_annual:
    value: 0.10
    low: 0.05
    high: 0.20
    unit: share of the eligible population with a FIT result in a year, GCC outside Abu Dhabi
    status: assumed
    basis: "Qatar interim programme: 11,130 of about 32,500 invited returned a FIT (34 percent of those invited, PMC9822526); Saudi Qassim study: annual adherence 43.1 percent among those who accepted (PMC12868166); Kuwait practice below 30 percent (PMC11175023). Whole-population annual participation is chosen well below these invited-group figures."

# Outcome value (section 4): treatment cost avoided when a positive FIT reaches colonoscopy before harm accrues.
outcome:
  advanced_stage_risk_on_time_derived:
    value: 0.0098
    unit: risk, advanced stage, colonoscopy at 8-30 days
    status: sourced-adjacent
    basis: "Derived, not read from the paper: a JAMA commentary on Corley 2017 reports 19 advanced-stage cases per 1,000 at 10 months (OR 1.97) and 31 per 1,000 beyond 12 months (OR 3.22); inverting each odds ratio gives a reference risk of 0.0097 and 0.0098. Replaces the 0.008 placeholder for this section only. To verify against Corley 2017 table 3."

  usd_aed_peg:
    value: 3.6725
    unit: AED per USD
    status: sourced
    basis: "Fixed dirham peg of 3.6725 per US dollar. Central Bank of the UAE publication URL to verify."

  crc_cost_stage1_usd_saudi:
    value: 45317
    unit: USD per patient, first year after diagnosis, stage I, 2020 prices
    status: sourced-adjacent
    basis: "Saudi single-centre study, 326 patients, Riyadh, payer view, direct medical costs, enrolled 2017-2020 (PMC10630777, 2023). Stage I mean USD 45,317. Stage II and III values are only in a figure. One hospital, one country, first year only."

  crc_cost_stage4_usd_saudi:
    value: 71374
    unit: USD per patient, first year after diagnosis, stage IV, 2020 prices
    status: sourced-adjacent
    basis: "Same study (PMC10630777): the text says stage IV 'exceeded' USD 71,374, so this is a lower bound."

  crc_cost_stage1_myr_malaysia:
    value: 13485.9
    unit: MYR per patient, first year, stage I, 2012 prices
    status: sourced-adjacent
    basis: "Azzani et al., Malays J Med Sci 2019;26(1):73-86 (PMC6419868), table 10, provider cost at one tertiary hospital. The abstract says 13,672; table 10 says 13,485.9."

  crc_cost_stage4_myr_malaysia:
    value: 27972
    unit: MYR per patient, first year, stage IV, 2012 prices
    status: sourced-adjacent
    basis: "Same study (PMC6419868), table 10."

  myr_per_usd_malaysia:
    value: 3.10
    unit: MYR per USD
    status: sourced-adjacent
    basis: "Rate used by the Malaysian paper (2012). No inflation adjustment is applied to the Malaysian figures, which understates them in current prices."

  stage_pair_factor:
    value: 0.6
    low: 0.4
    high: 1.0
    unit: share of the stage I to stage IV cost gap that applies to one case moved from advanced stage (III or IV) to early stage (I or II)
    status: assumed
    basis: "Corley's advanced stage is III and IV; the cost studies give I and IV. A shift from the advanced group to the early group is smaller than a shift from IV to I. Chosen at 0.6 with 0.4 to 1.0 as the sensitivity. Not sourced."

# Capacity value (section 5).
capacity:
  productive_hours_per_fte_year:
    value: 1700
    low: 1500
    high: 1900
    unit: productive hours per full-time coordinator per year
    status: assumed
    basis: "About 220 working days of 8 hours less meetings, training and leave. Employer-specific; to verify with the provider's HR."

# Price benchmarks (section 3).
benchmark:
  navigation_cost_per_person_navigated_usd:
    value: 150
    low: 66
    high: 338
    unit: USD per person navigated (median and interquartile range), 2022 prices
    status: sourced-adjacent
    basis: "Community Guide systematic economic review of patient navigation for colorectal cancer screening: median intervention cost per person USD 150 (interquartile 66 to 338), 16 studies, 2022 dollars (https://thecommunityguide.org/findings/cancer-screening-patient-navigation-services-to-increase-colorectal-cancer-screening.html). Mostly US human-navigator programmes for screening, not positive-FIT follow-up."

  navigation_cost_per_additional_person_usd:
    value: 663
    low: 202
    high: 1711
    unit: USD per additional person screened (median and interquartile range), 2022 prices
    status: sourced-adjacent
    basis: "Same review: median USD 663 per additional person screened (interquartile 202 to 1,711), 17 studies, 2022 dollars."
