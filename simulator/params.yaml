  programme_reach: {value: 1.0, source: "Design choice, not evidence: the upper-range scenario assumes every case in the orchestrated arm receives the orchestrated process. simulator/params.conservative.yaml lowers it (literature-anchored scenario)", status: assumed, notes: "Share of orchestrated-arm cases that actually get the orchestrated process (named owner, timers, ladder, consent ledger, watchdog); the rest follow today's baseline process. 1.0 = the mechanism ceiling."}
  watchdog_idle_days: {value: 14, source: "assumed, no public source", status: assumed}
  watchdog_effect_prob: {value: 0.90, source: "assumed, no public source", status: assumed}
