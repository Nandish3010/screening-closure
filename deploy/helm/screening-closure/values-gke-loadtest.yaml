# GKE load test (docs/governance/gke-loadtest.md, `make gke-loadtest`): the chart's production defaults plus the deviations below.
# Same topology and per-pod limits as the kind runs in docs/results/scale.md (values-kind.yaml), so the two are comparable:
# 3 API replicas (1 CPU / 768 MiB limit), 2 schedulers, 1 watchdog. Nothing here is a production sizing.
# DEVIATIONS FROM PRODUCTION, and why:
#  1. images: REGISTRY is replaced by the Artifact Registry repository the script creates (--set images.*.repository / tag at install).
#  2. replicas: api 3 (production default 2), HPA OFF: the test needs a fixed number of pods. `api.autoscaling.enabled=true` renders and lints
#     (helm template) but is not exercised by the load test.
#  3. Identity: as in values-kind.yaml, APP_ENV stays `production` (every secure_config_problems() check applies) and the API fetches its
#     signing keys from the in-cluster JWKS pod `sc-jwks`; tokens are minted with a throw-away RSA key (Secret sc-oidc-signing).
#  4. FHIR: no FHIR server in the cluster; fhirProjection "false", fhirVerifyEvidence "true" (the API refuses to start otherwise). Cases are not closed.
#  5. Database: in-cluster Postgres 16 (deploy/gke/chart), no TLS, no HA, no backups, on a pd-ssd volume. Production: managed server with sslmode=require.
#  6. Secrets are generated by the script (openssl) into Kubernetes Secrets; nothing is committed and `secrets.create` stays false.
#  7. Service is ClusterIP; the load generator runs INSIDE the cluster (pod `loadgen`), no ingress, no load balancer, no public address.
#  8. NetworkPolicy is OFF: the cluster is created without a network-policy enforcer (the kind runs did not enforce it either), so the rules would be
#     unverified and an untested rule could fail the paid run. The chart's rules are linted and rendered (helm template) separately.
#  9. Everything is scheduled onto the `app` node pool (nodeSelector); Postgres and the load generator have their own pools, so the three
#     measured components do not share a node with the database or the generator.
images:
  api:       { repository: REGISTRY/screening-closure-api,       tag: gke, pullPolicy: IfNotPresent }
  scheduler: { repository: REGISTRY/screening-closure-scheduler, tag: gke, pullPolicy: IfNotPresent }
  watchdog:  { repository: REGISTRY/screening-closure-watchdog,  tag: gke, pullPolicy: IfNotPresent }

nodeSelector: { sc-pool: app }

api:
  replicas: 3
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 768Mi }
  sweepWorkers: "1"          # as the kind runs: single-process sweeps, one CPU per pod
  service: { type: ClusterIP, port: 8000 }
  autoscaling: { enabled: false }

scheduler:
  replicas: 2

watchdog:
  replicas: 1

app:
  env: production
  oidcIssuer: https://idp.gke-loadtest.invalid/realms/sc-gke
  oidcJwksUrl: http://sc-jwks:8080/jwks.json
  fhirBaseUrl: http://fhir.invalid/fhir
  fhirVerifyEvidence: "true"
  fhirProjection: "false"

networkPolicy:
  enabled: false
