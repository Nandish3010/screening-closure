    example: "خذ ملين الليلة."
  - id: treatment
    phrase: "علاج"
    category: medication_or_treatment
    rationale: Implies a treatment decision that has not been made.
    example: "سيبدأ العلاج قريباً."
  - id: surgery
    phrase: "جراحة"
    category: medication_or_treatment
    rationale: Implies a treatment decision that has not been made.
    example: "ستحتاج إلى جراحة."
  - id: chemotherapy
    phrase: "كيماوي"
    category: medication_or_treatment
    rationale: Implies a treatment decision that has not been made.
    example: "العلاج الكيماوي."
  - id: chemotherapy_formal  # AI Arabic review 2026-10-18: added
    phrase: "كيميائي"
    category: medication_or_treatment
    rationale: Formal spelling of chemotherapy; implies a treatment decision.
    example: "العلاج الكيميائي."
  - id: you_must
    phrase: "يجب عليك"
    category: advice
    rationale: Only "the next step is ...; your care team will contact you" is allowed as an instruction.
    example: "يجب عليك الصيام."
  - id: we_advise
    phrase: "ننصحك"
    category: advice
    rationale: Advice beyond the next step is for the care team.
    example: "ننصحك بتجنب اللحوم."
  - id: you_should
    phrase: "ينبغي"
    category: advice
    rationale: Advice beyond the next step is for the care team.
    example: "ينبغي أن تتوقف عن الأكل."
  - id: you_need_to
    phrase: "عليك ان"
    category: advice
    rationale: Advice beyond the next step is for the care team.
