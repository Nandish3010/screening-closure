# Prometheus for the `obs` compose profile (F14). It scrapes the collector's Prometheus exporter (the API's OTLP metrics).
# A deployment that scrapes the API directly uses GET /metrics with `authorization.credentials_file` pointing at the
# scrape token (docs/governance/deployment.md); do not run both against the same Prometheus, the series would double.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
