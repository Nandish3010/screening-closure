# TODO native-speaker review (H2): every string in this file is an unreviewed Arabic draft.
# Until a native speaker signs off, label it "Arabic draft, unreviewed" in any submission.
# Same rules as en.yaml: plain Modern Standard Arabic, short sentences (about grade-6 reading
# level), no diagnosis, no advice beyond "the next step is ...; your care team will contact you".
# E14, non-disclosure: no message states or hints at what the screening found. IFHAS: abnormal
# results are communicated with the participant present, so a message says only that the result
# is ready, that the care team needs to talk with the patient, and who will call. The next step
# is named as an appointment ("a camera test"), never as a disease or a finding.
# Placeholders: {owner_name} {next_step} {appointment_date}. `{next_step}` and
# `{appointment_date}` are supplied in Arabic by the caller. `_with_date` variants are used when
# an appointment date is supplied. Limits: sms 320, whatsapp 600, letter 1200 characters.
#
# AI Arabic review 2026-10-18 (AI-assisted, not a native-speaker human review; H2 still pending).
# Record: docs/governance/arabic-review.md. Conventions applied to every text below:
#   - Terms: فحص الكشف المبكر (screening test), فحص بالكاميرا (camera test, via {next_step}),
#     فريق رعايتك (care team), موعد (appointment), نتيجة (result), الشخص المسؤول عن رعايتك (care owner).
#   - Gender: no form that changes with the patient's or the owner's gender. "{owner_name} will call
#     you" is سيصلك اتصال من {owner_name} (the verb agrees with اتصال, not with the owner), and
#     "your care owner is X" is الشخص المسؤول عن رعايتك: X (no هو/هي before a woman's name).
#   - Greeting: مرحباً in SMS and WhatsApp, تحية طيبة in letters (neutral for every reader).
#   - Tanween written ـاً (on the alef); Arabic comma ، ; sentences end with "."; Western digits.
#   - Direction: no bidi marks (validate.py refuses every Cf character, SEC-1). Instead every line
#     starts with an Arabic word, and each placeholder is followed by Arabic punctuation or text,
#     never by another placeholder or a digit.
#   - Never the substrings دم or تنظير (test_ai_validate.py checks the raw text).
version: 2
language: ar
purposes:
  # TODO native-speaker review (H2)
  result_notification:
    description: >-
      First message to the patient once the result has an accepted care owner. It states no finding;
      the care team explains the result in person or by phone.
    # AI Arabic review 2026-10-18: "screening" named; sentence split; gender-neutral call line.
    sms: >-
      نتيجة فحص الكشف المبكر جاهزة. يحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية، وهي {next_step}.
      سيصلك اتصال من {owner_name}، أو يمكنك الرد على هذه الرسالة لحجز موعد.
    # AI Arabic review 2026-10-18: paragraphs follow the English; same "explain" line as the patient page.
    whatsapp: |-
      مرحباً، هذه رسالة من فريق رعايتك.

      نتيجة فحص الكشف المبكر جاهزة. يحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية.

      الخطوة التالية هي {next_step}. سيشرح لك فريق رعايتك نتيجتك وجهاً لوجه أو عبر الهاتف.

      سيصلك اتصال من {owner_name}، أو يمكنك الرد على هذه الرسالة لحجز موعد.
    # AI Arabic review 2026-10-18: neutral greeting; owner line without هو before a woman's name.
    letter: |-
      تحية طيبة،

      نكتب إليك بخصوص فحص الكشف المبكر الذي أجريته مؤخراً.

      نتيجة فحصك جاهزة. يحتاج فريق رعايتك إلى التحدث معك عن الخطوة التالية.

      الخطوة التالية هي {next_step}. سيشرح لك فريق رعايتك نتيجتك وجهاً لوجه أو عبر الهاتف.

      سيصلك اتصال من {owner_name}، أو يمكنك التواصل مع فريق رعايتك لحجز موعد.
      الشخص المسؤول عن خطوتك التالية في فريق رعايتك: {owner_name}.

      مع تحياتنا،
      فريق رعايتك
  # TODO native-speaker review (H2)
