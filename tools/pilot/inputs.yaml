# Inputs for tools/pilot/cost_model.py.
#
# EVERY value here is an assumption chosen to show the shape of the cost curve. None comes from a quote,
# a contract, a published price list or pilot data. Replace each one with a sourced figure (and change its
# status) before any number from this model is used in a commercial conversation.
#
# Format: a small YAML subset (nested mappings, scalars, inline lists, # comments) read by the script's own
# parser, so no third-party package is needed. Currency is AED. Each input has: value, unit, status, basis.
# status must be "assumed" or "sourced"; the script refuses an input with no status.

currency: AED

scenarios:
  screened_members_per_year: [10000, 50000, 200000]

inputs:
  positivity_rate:
    value: 0.07
    unit: share of screened members with a positive FIT
    status: assumed
    basis: Same value as simulator/params.yaml fit_positivity_rate (assumed there too; published ranges around 5-8 percent are to verify in docs/evidence.md).

  hosting_fixed_aed_per_month:
    value: 9000
    unit: AED per month
    status: assumed
    basis: In-country hosting of the full stack with a standby copy (database, API, scheduler, watchdog, FHIR server, web). Not a quote.

  hosting_variable_aed_per_1000_cases_per_year:
    value: 400
    unit: AED per 1,000 actionable cases per year
    status: assumed
    basis: Storage and compute growth with case volume. Not a quote.

  third_party_licences_aed_per_year:
    value: 24000
    unit: AED per year
    status: assumed
    basis: Monitoring, backup and logging tools. Excludes our own product fee, which is modelled separately under pricing.

  support_fte_base:
    value: 0.5
    unit: FTE
    status: assumed
    basis: Operations, on-call and release support needed at any volume.

  support_fte_per_50k_members:
    value: 0.25
    unit: FTE per 50,000 screened members per year
    status: assumed
    basis: Extra support as volume and provider count grow.

  support_fte_loaded_cost_aed_per_year:
    value: 300000
    unit: AED per FTE per year
    status: assumed
    basis: Fully loaded engineer or support analyst cost.

  integration_one_off_aed_per_provider:
    value: 120000
    unit: AED per participating provider, one-off
    status: assumed
    basis: Data feed build and test, role set-up, training, and local security assessment support.

  members_per_provider:
    value: 20000
    unit: screened members per year per provider
    status: assumed
    basis: Used only to estimate how many providers a given volume implies.

  amortisation_years:
    value: 3
    unit: years
    status: assumed
    basis: Period over which the one-off integration cost is spread.

  coordinator_minutes_per_case_manual:
    value: 57.3
    unit: staff minutes (all roles) per actionable case without the engine
    status: assumed
    basis: "Source: docs/results/results.json effort (cut-effort), baseline arm, human minutes per case; minutes come from published time studies and assumptions, synthetic. Status assumed-until-regenerated (the script accepts only assumed or sourced). All roles are valued at the coordinator rate below, which understates clinician and specialist time. To be measured in the pilot shadow period (K9)."

  coordinator_minutes_per_case_with_engine:
    value: 45.5
    unit: staff minutes (all roles) per actionable case with the engine
    status: assumed
    basis: "Source: docs/results/results.json effort (cut-effort), literature-anchored orchestrated arm at programme level (20.5 percent fewer minutes, 0.55 reach); 35.8 in reach. Status assumed-until-regenerated. Coordinator minutes fall but owner-clinician and specialist minutes rise, so valuing all roles at the coordinator rate overstates the saving: at assumed wage ratios (clinician 3x, specialist 4x a coordinator, assumed) weighted time per case is flat. To be measured in the pilot (K9)."

  coordinator_cost_aed_per_hour:
    value: 120
    unit: AED per hour
    status: assumed
    basis: Loaded cost of a screening or referral coordinator. Wage ratios used in the docs, clinician 3x and specialist 4x a coordinator, are assumed and not read by the script.

  price_per_screened_member_per_year_aed:
    value: 6.0
    unit: AED per screened member per year
    status: assumed
    basis: Illustrative fee for commercial option A. Not an offer.

  price_per_actionable_case_aed:
    value: 90
    unit: AED per actionable (FIT-positive) case
    status: assumed
    basis: Illustrative fee for commercial option B. Not an offer.

pilot:
  pilot_providers:
    value: 3
    unit: providers
    status: assumed
    basis: Pilot plan asks for two to three providers; the upper end is used.

  pilot_fit_screened_per_provider_per_year:
    value: 3000
    unit: FIT results per provider per year
    status: assumed
    basis: Placeholder until providers supply their real volumes (a data request in the pilot plan).

  pilot_days:
    value: 90
    unit: days
    status: assumed
    basis: Enrolment window of the pilot (30 days shadow, 60 days active).

  followup_tail_days:
    value: 90
    unit: days
    status: assumed
    basis: Follow-up after the last enrolment so cases can reach closure and be measured. A decision of this plan, not part of the original brief.

  pilot_support_fte:
    value: 1.0
    unit: FTE during the enrolment window
    status: assumed
    basis: Pilot manager and engineer support.

  tail_support_fte:
    value: 0.25
    unit: FTE during the follow-up tail
    status: assumed
    basis: Monitoring and reporting only.

  pilot_governance_review_one_off_aed:
    value: 60000
    unit: AED, one-off
    status: assumed
    basis: Clinical safety review, security assessment, legal review of data agreements.

# Shadow-only pilot: the engine reads a periodic flat-file (CSV) or HL7 v2 export of FIT results, referrals and
# colonoscopy records instead of a full integration, computes owners, clocks, overdue flags and escalation
# suggestions, and sends and assigns nothing. Coordinators review the flags weekly. These inputs are assumptions
# chosen to be plausible relative to the full-pilot inputs above; none is a quote. The model also reuses
# pilot_providers, pilot_fit_screened_per_provider_per_year, positivity_rate, the hosting inputs, the licence
# input and support_fte_loaded_cost_aed_per_year.
shadow_pilot:
  shadow_integration_one_off_aed_per_provider:
    value: 15000
    unit: AED per participating provider, one-off
    status: assumed
    basis: Mapping and validating one periodic export (flat file or HL7 v2) per provider; no live interface, no outbound channel, no role set-up for messaging. Much lower than the 120,000 for a full integration. Not a quote.

  shadow_days:
    value: 90
    unit: days
    status: assumed
    basis: Length of the shadow-only run. Cases are not followed to closure by the engine, so no follow-up tail is funded.

  shadow_support_fte:
    value: 0.3
    unit: FTE during the shadow run
    status: assumed
    basis: Loading and checking the periodic export, tuning flags and a weekly review with the coordinator. Lower than the 1.0 FTE of the full pilot because nothing is sent or assigned.

  shadow_governance_review_one_off_aed:
    value: 25000
    unit: AED, one-off
    status: assumed
    basis: Data sharing agreement and security assessment for a read-only export; no clinical safety review of outbound wording. Lower than the 60,000 of the full pilot.

  shadow_hosting_share_of_full:
    value: 0.4
    unit: share of the full-stack hosting cost
    status: assumed
    basis: A single copy without a standby, and no messaging or web channel. Applied to both the fixed and the variable hosting inputs.

  shadow_licences_share_of_full:
    value: 0.5
    unit: share of the third-party licence cost
    status: assumed
    basis: Monitoring, backup and logging for a smaller footprint.

# Value side (illustrative only): the simulated shares of cases with no colonoscopy by day 270 are READ from
# docs/results/results.json by the script (they are synthetic outputs, not inputs here); these inputs turn a
# shift in that share into cancers using published odds ratios from Corley et al., JAMA 2017 (docs/evidence.md
# section 9). Observational odds ratios, applied to a different population, so every value is assumed here.
value:
  crc_risk_on_time:
    value: 0.030
    unit: risk, any CRC, colonoscopy at 8-30 days
    status: assumed
    basis: Corley 2017 any CRC at 8-30 days (docs/evidence.md section 9). Applied to a different population, so assumed here.

  advanced_stage_risk_on_time:
    value: 0.008
    unit: risk, advanced stage, colonoscopy at 8-30 days
    status: assumed
    basis: Placeholder, to verify against Corley 2017 (not recorded in docs/evidence.md).

  or_any_crc_10_to_12_months:
    value: 1.48
    unit: odds ratio, any CRC, 10-12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the lower illustrative case. Observational, confounding by indication.

  or_advanced_stage_10_to_12_months:
    value: 1.97
    unit: odds ratio, advanced stage, 10-12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the lower illustrative case.

  or_any_crc_over_12_months:
    value: 2.25
    unit: odds ratio, any CRC, over 12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the higher illustrative case.

  or_advanced_stage_over_12_months:
    value: 3.22
    unit: odds ratio, advanced stage, over 12 months vs 8-30 days
    status: assumed
    basis: Corley 2017 (docs/evidence.md section 9); the higher illustrative case.
