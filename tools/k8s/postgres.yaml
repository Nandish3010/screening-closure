# In-cluster Postgres for the kind deployment (NOT part of the chart: production uses a managed server, deployment.md).
# Same major version as docker-compose.yml (postgres:16). One replica, a PVC on kind's default local-path class, no TLS,
# no backups: a throw-away benchmark database. The superuser is `closure_owner` (the schema owner of the chart's
# MIGRATE_DATABASE_URL); migration 009 creates the unprivileged `closure_app` and the migrate hook sets its password,
# so no role-creating init script is needed (docker/postgres-init only creates closure_test and hapi, which nothing here uses).
# The password comes from the Secret `sc-postgres` (key `password`), generated by up.sh.
#
# M7-6 tuning (measured: docs/results/scale/sweep.json, cells labelled `baseline` vs `tuned`): the original settings
# (shared_buffers 256MB, 1536Mi limit, 64 MB /dev/shm, random_page_cost 4) left a 1M-case database (2.3 GB: events heap 1.0 GB + 5 indexes
# 1.0 GB) mostly outside the cache, so the sweep's per-case event reads and appends were I/O-bound, and VACUUM / parallel plans
# failed with "could not resize shared memory segment ... No space left on device" because Docker gives a container 64 MB of
# /dev/shm. Changes: shared_buffers 1GB, effective_cache_size 2GB, random_page_cost 1.1 (local SSD), work_mem 16MB,
# maintenance_work_mem 256MB, max_wal_size 4GB + checkpoint_timeout 15min (bulk appends no longer force a checkpoint every
# ~1 GB of WAL), a 512Mi in-memory /dev/shm volume, memory limit 3Gi (request 1Gi).
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: closure, labels: { app: sc-postgres } }
spec:
  clusterIP: None
  selector: { app: sc-postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-nodeport, namespace: closure, labels: { app: sc-postgres } }
spec:
  type: NodePort
  selector: { app: sc-postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg, nodePort: 30077 }]   # kind-config.yaml maps host 127.0.0.1:15476 to it
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: closure, labels: { app: sc-postgres } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: sc-postgres } }
  template:
    metadata: { labels: { app: sc-postgres } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=300", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=2GB", "-c", "random_page_cost=1.1",
                 "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB", "-c", "max_wal_size=4GB", "-c", "checkpoint_timeout=15min"]
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: closure_owner }
            - { name: POSTGRES_DB, value: closure }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sc-postgres, key: password } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U closure_owner -d closure"] }
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 20
          # timeoutSeconds 10 / failureThreshold 6: the kind nodes share a small Docker VM with other stacks; with the default
          # 1 s timeout a CPU- or swap-starved VM made pg_isready time out and the kubelet killed a healthy Postgres in the middle
          # of a drill (crash recovery, dropped connections). A real outage still fails the probe six times in a row (60 s).
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U closure_owner -d closure"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
