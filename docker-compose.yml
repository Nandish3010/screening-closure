# Runs fully offline on a laptop. No external network calls at demo time.
name: screening-closure

# Hardening (SEC-1, ADR-029): every published port is bound to the loopback interface (127.0.0.1), so nothing here is
# reachable from the network the laptop is on; tools/check/compose_lint.py fails the build on a port without it. The API
# connects to Postgres as the unprivileged role `closure_app` (api/migrations/009_app_role.sql), not as the superuser; the
# schema is changed by the one-shot `migrate` service, which is the only application container holding the owner's
# credentials. HAPI keeps the superuser but has its own database, `hapi`.
x-api-build: &api-build
  context: ./api
  target: runtime

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"  # host access for `make test-db` (5432 is often taken locally)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-closure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-closure}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `closure_test` and `hapi` databases on a fresh volume (ADR-015, SEC-1).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [closure]

  # Creates the databases `closure_test` and `hapi` if the volume predates them (a fresh volume gets them from
  # docker/postgres-init). One-shot; the superuser, because creating a database needs it.
  db-init:
    image: postgres:16
    restart: "no"
    entrypoint: ["/bin/sh", "/init/10-create-databases.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-closure_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-closure}
    volumes:
      - ./docker/postgres-init:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [closure]

  # Applies api/migrations as the database owner and sets the password of `closure_app` from APP_DB_PASSWORD, then exits.
  # The API starts only after it succeeded. The one application container with the owner's credentials.
  migrate:
    build: *api-build
    restart: "no"
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-closure}:${POSTGRES_PASSWORD:-closure_dev_password}@postgres:5432/${POSTGRES_DB:-closure}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-closure_app_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [closure]

  # HAPI FHIR R4, stored in the shared postgres server in its OWN database, `hapi` (HAPI's tables are hfj_*/trm_*/
  # etc.). It used to run on HAPI's default in-memory H2, but the synthetic cohort (~1 GB of FHIR JSON for 300
  # patients) exhausts the JVM heap ("Out of memory" in H2). It no longer shares `${POSTGRES_DB}` with the application
  # (SEC-1): the application's role cannot read FHIR data, and HAPI's superuser connection does not sit in the
  # application's database. A volume made before this change keeps its old hfj_* tables in `${POSTGRES_DB}`, unused:
  # the FHIR store starts empty, `make demo-seed` fills it again.
  # Consequence: `make reset` (down -v) wipes FHIR data together with the cases, keeping them consistent.
  fhir:
    # Pinned (F12, ADR-006): the image this project was built and tested on, HAPI FHIR 8.12.0 (docker.io digest
    # sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e, the same image `latest` pointed to on 2026-10-18).
    # The bare `v8.12.0` tag does not exist: HAPI starter tags carry a build suffix.
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "127.0.0.1:${FHIR_PORT:-8080}:8080"
    environment:
      hapi.fhir.fhir_version: R4
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-closure}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-closure_dev_password}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      # HAPI reuses the result of an identical search for 60 s by default. The automation's evidence scan (A21) searches for the
      # colonoscopy by case identifier; a "nothing yet" answer would then hide a Procedure written seconds later (the scan
      # does not ask again for six simulated hours, so a demo that moves the clock quickly would never see it). -1 turns the
      # reuse off: every search runs against the data.
      hapi.fhir.reuse_cached_search_results_millis: "-1"
      # A32 (ADR-025): erasure expunges a patient's FHIR resources ($expunge). HAPI soft-deletes by default (a DELETE leaves
      # the row, readable by history); expunge removes the rows and their history for good. Off by default in HAPI, so on here.
      # delete_expunge_enabled lets `DELETE ...?_expunge=true` work for compartment sweeps. docs/governance/erasure.md.
      hapi.fhir.expunge_enabled: "true"
      hapi.fhir.delete_expunge_enabled: "true"
      # Synthea patient bundles reach 20 MB each; the default container heap (~25% of RAM) is too small
      # to parse and process them in one transaction.
      JAVA_TOOL_OPTIONS: -Xmx3g
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [closure]

  api:
    build: *api-build
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment: &api-env
      PATHWAY_PATH: /config/pathways/colorectal_fit.yaml
      # More pathway packs the same engine runs (comma separated). Cervical screening: docs/governance/second-pathway.md.
      PATHWAY_PATHS: /config/pathways/cervical_hpv.yaml
      CALENDAR_PATH: /config/calendar.yaml
      # The automation actor (A21, ADR-032): acknowledge and assign on ingest, re-route, pre-approved outreach, evidence scan.
      # Its files are config/providers.yaml and config/outreach_policy.yaml; its token is AUTOMATION_SERVICE_TOKEN (.env).
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      PROVIDERS_PATH: /config/providers.yaml
      OUTREACH_POLICY_PATH: /config/outreach_policy.yaml
      # A26 (ADR-037): the shipped outreach policy is UNSIGNED (`approved_by: null`) and an unsigned policy sends nothing.
      # The demo runs the automatic path under "DEMO PLACEHOLDER (clinical sign-off pending, H1)": /health reports it and the
      # web shows an amber banner on the case page and the dashboard. The API refuses to start with this on outside APP_ENV=dev.
      OUTREACH_DEMO_APPROVAL: ${OUTREACH_DEMO_APPROVAL:-1}
      # Model provider (A35, ADR-043). The demo runs offline from the recorded Claude outputs in api/app/ai/cache/: replay mode, network
      # off, and a prompt with no recording gets the template with abstention reason `cache_miss`. To call Claude live, set
      # LLM_NETWORK_ENABLED=true and LLM_CACHE_MODE=off (or record) AND pass ANTHROPIC_API_KEY (+ ANTHROPIC_WORKSPACE_ID if the key is
      # not workspace-scoped) in the environment; this file never passes a key. The agency planner uses rules unless AGENCY_PLANNER=claude.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_CACHE_MODE: ${LLM_CACHE_MODE:-replay}
      LLM_NETWORK_ENABLED: ${LLM_NETWORK_ENABLED:-false}
      AGENCY_PLANNER: ${AGENCY_PLANNER:-claude}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-200000}
      LLM_MAX_TOKENS_PER_CALL: ${LLM_MAX_TOKENS_PER_CALL:-2048}
      # The agency (A22, ADR-033): the scheduler hook starts an agency run every N-th sweep (the code default is 6). 0 = never, which
      # keeps the demo snapshot deterministic: no agency run (and so no agency-drafted message_drafted event on the demo case) fires from
      # the scheduler. Trigger one by hand with `make agency-run`; set AGENCY_EVERY_SWEEPS=6 to rehearse the scheduled runs.
      AGENCY_EVERY_SWEEPS: ${AGENCY_EVERY_SWEEPS:-0}
      # Set explicitly so a missing .env cannot silently fall back to the in-memory store. The unprivileged role, not the
      # owner (SEC-1): it can add events, not alter or delete them, and cannot change the schema.
      DATABASE_URL: postgresql://closure_app:${APP_DB_PASSWORD:-closure_app_dev_password}@postgres:5432/${POSTGRES_DB:-closure}
      # `close` needs an evidence_ref (DiagnosticReport/<id> or Procedure/<id>) that exists in HAPI (A15, ADR-021).
      FHIR_BASE_URL: http://fhir:8080/fhir
      FHIR_VERIFY_EVIDENCE: "true"
      # Project every event to HAPI (Task, ServiceRequest, Appointment, Communication, Consent, Provenance; A12).
      FHIR_PROJECTION: "true"
      # Sweep worker processes behind POST /scheduler/sweep (A17); empty = min(4, cpus), 1 = single process.
      SWEEP_WORKERS: ${SWEEP_WORKERS:-}
      # Identity (A29, ADR-040): AUTH_MODE=dev (HMAC dev-login) or oidc (Keycloak profile below, `make oidc-up`). The issuer is
      # the URL the BROWSER uses (it is the token's `iss`); the API fetches the keys from the keycloak service on the network.
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8180}/realms/screening-closure}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/screening-closure/protocol/openid-connect/certs}
      # A30 (ADR-041): `sim` (default: the persisted simulation clock, /clock/* in APP_ENV=dev) or `wall` (real UTC time, no clock routes).
      CLOCK_MODE: ${CLOCK_MODE:-sim}
      # A31 (ADR-041): the lease the scheduler instances and the API replicas elect their leaders with, and whether a scheduler call
      # without a current fencing token is refused (the `scale` profile sets it).
      LEADER_LEASE_TTL_SECONDS: ${LEADER_LEASE_TTL_SECONDS:-30}
      REQUIRE_LEADER_FENCE: ${REQUIRE_LEADER_FENCE:-false}
      # D15: MLX cannot run in this Linux container, so the reply triage asks the model served on the HOST (`make triage-serve`,
      # tools/triage/serve.py, 127.0.0.1:8765). Unreachable, slow (2 s) or malformed means the fail-safe: the reply goes to a person.
      # Set TRIAGE_REMOTE_URL= (empty) to use the in-process path instead. The opt-out keyword gate runs before either.
      TRIAGE_REMOTE_URL: ${TRIAGE_REMOTE_URL-http://host.docker.internal:8765}
      # F14 observability (docs/governance/deployment.md): metrics are always collected and served at the protected GET /metrics
      # (a supervisor's token or METRICS_SCRAPE_TOKEN). With an OTLP endpoint set (`make up-obs` sets it to the collector of the
      # `obs` profile) the API also exports metrics and traces over OTLP/HTTP. LOG_FORMAT=json makes the logs JSON with trace_id.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    # Linux hosts need the mapping; Docker Desktop already resolves host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [closure]

  # A31: a second API replica (profile `scale`): same image, same environment, same database; no published port, the proxy reaches it.
  api-2:
    profiles: [scale]
    build: *api-build
    env_file:
      - path: .env
        required: false
    environment: *api-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [closure]

  scheduler:
    build: ./scheduler
    env_file:
      - path: .env
        required: false
    environment: &scheduler-env
      # With the `scale` profile this is the proxy (`SCHEDULER_API_URL=http://proxy:8080`, `make up-scale`); alone, the one API.
      API_URL: ${SCHEDULER_API_URL:-http://api:8000}
      # A31: the name this instance leads under (the lease holder); readable in /heartbeats and in the chaos test.
      SCHEDULER_HOLDER: scheduler-1
      SCHEDULER_FOLLOWER_POLL_SECONDS: ${SCHEDULER_FOLLOWER_POLL_SECONDS:-2}
      HEARTBEAT_PATH: /heartbeat/scheduler.json
      # It speaks HTTP to the API and has no database connection (SEC-1). Blank what a `.env` copied from
      # .env.example would hand it through env_file: the owner's database URL and password.
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
    volumes:
      - heartbeat:/heartbeat
    depends_on:
      api:
        condition: service_healthy
    networks: [closure]

  # A31: a second scheduler instance (profile `scale`). It asks for the same lease, finds it held and idles as a `follower`
  # until the leader stops renewing; then it takes over within the lease TTL. Its own heartbeat file volume.
  scheduler-2:
    build: ./scheduler
    profiles: [scale]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *scheduler-env
      SCHEDULER_HOLDER: scheduler-2
      API_URL: ${SCHEDULER_API_URL:-http://proxy:8080}
      HEARTBEAT_PATH: /tmp/scheduler-2.json
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks: [closure]

  # A31: a tiny reverse proxy in front of the two API replicas (profile `scale`), round-robin with active health checks. Pinned.
  # Caddy 2.8.4 (alpine); config in docker/proxy/Caddyfile. Loopback only, like every published port.
  proxy:
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    profiles: [scale]
    ports:
      - "127.0.0.1:${PROXY_PORT:-8100}:8080"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks: [closure]

  watchdog:
    build: ./watchdog
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-10}
      # As the scheduler: HTTP only, no database credentials even when .env carries them.
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
    depends_on:
      api:
        condition: service_healthy
    networks: [closure]

  # The HL7 v2 MLLP listener (A28, ADR-039): OFF by default (profile "hl7"; start it with `docker compose --profile hl7 up -d
  # hl7-listener`). It frames MLLP on port 2575 and posts each message to the API's POST /hl7 with the system:hl7 service
  # token, so it shares the handler with the HTTP transport and holds no database credentials. Clear text, loopback only:
  # a real link needs a VPN or TLS tunnel agreed with the exchange operator (docs/governance/hl7-adapter.md).
  hl7-listener:
    build: *api-build
    profiles: [hl7]
    command: ["python", "-m", "app.hl7.mllp"]
    ports:
      - "127.0.0.1:${HL7_MLLP_PORT:-2575}:2575"
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
      HL7_MLLP_PORT: "2575"
      # Optional TLS / client certificates (docs/governance/hl7-adapter.md, "TLS and client certificates"); mount the files first.
      # HL7_TLS_CERT: /certs/server.pem
      # HL7_TLS_KEY: /certs/server.key
      # HL7_TLS_CLIENT_CA: /certs/ca.pem
      # HL7_TLS_ALLOWED_CLIENT_CNS: good-client
      HL7_SERVICE_TOKEN: ${HL7_SERVICE_TOKEN:-dev-only-hl7-service-token}  # the development default works only while APP_ENV=dev
      # Blank what a `.env` copied from .env.example would hand it: it speaks HTTP to the API and needs no database.
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
    depends_on:
      api:
        condition: service_healthy
    networks: [closure]

  # A local OIDC provider standing in for UAE PASS (A29, ADR-040, docs/governance/identity.md). OFF by default (profile "oidc");
  # `make oidc-up` generates the demo passwords, starts it and switches the API to AUTH_MODE=oidc. Dev mode (start-dev, plain
  # HTTP, H2 database inside the container): a development tool, never a deployment. The realm is imported from
  # config/keycloak/screening-closure-realm.json; the passwords in it are placeholders filled from the environment at import.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7  # pinned; bump deliberately
    profiles: [oidc]
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # The issuer is the browser-facing URL whatever host the request used; the API reaches keycloak:8080 on the network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # Realm-import placeholders (one password per demo user, plus the demo patient's reference). Empty unless
      # tools/identity/oidc_up.sh (`make oidc-up`) exported them: start the profile through it, not by hand.
      KC_PW_LAB: ${KC_PW_LAB:-}
      KC_PW_COORDINATOR: ${KC_PW_COORDINATOR:-}
      KC_PW_OWNER: ${KC_PW_OWNER:-}
      KC_PW_SPECIALIST: ${KC_PW_SPECIALIST:-}
      KC_PW_CLINICIAN: ${KC_PW_CLINICIAN:-}
      KC_PW_SUPERVISOR: ${KC_PW_SUPERVISOR:-}
      KC_PW_PATIENT: ${KC_PW_PATIENT:-}
      DEMO_PATIENT_REF: ${DEMO_PATIENT_REF:-Patient/demo-patient}
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    networks: [closure]

  # ---- F14: the observability stack (profile `obs`; `make up-obs`). Pinned by digest, every published port on loopback. -----
  # API --OTLP/HTTP--> otel-collector --> (metrics) prometheus exporter :8889 --scraped by--> prometheus --> grafana.
  # Traces go to the collector's debug exporter (readable with `docker compose logs otel-collector`); point the collector at the
  # trace backend the host approves (deployment.md). Nothing here leaves the laptop.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0@sha256:a2a52e43c1a80aa94120ad78c2db68780eb90e6d11c8db5b3ce2f6a0cc6b5029
    profiles: [obs]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [closure]

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    depends_on: [otel-collector]
    networks: [closure]

  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    profiles: [obs]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-closure_grafana_dev}  # development default; loopback only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    networks: [closure]

  # The api's unit tests, in the image's `test` stage (pytest and the dev extras are NOT in the api image above). The
  # fallback of `make test` when there is no local .venv:  docker compose --profile tests run --rm --no-deps api-test
  api-test:
    build:
      context: ./api
      target: test
    profiles: [tests]
    environment:
      DATABASE_URL: ""
    command: ["pytest", "tests", "-q", "-m", "not integration and not chaos and not oidc"]
    networks: [closure]

  # Synthetic cohort generator. Not started by `make up` (profile "tools"); run with `make synthea`.
  # The downloaded Synthea jar is untrusted input: it executes only inside this container, and
  # the only host path it can write is ./data (gitignored).
  synthea:
    image: eclipse-temurin:17-jre
    profiles: [tools]
    entrypoint: ["/bin/sh", "/tools/run.sh"]
    environment:
      SYNTHEA_VERSION: ${SYNTHEA_VERSION:-v3.3.0}
      SYNTHEA_SEED: ${SYNTHEA_SEED:-20261017}
      SYNTHEA_POPULATION: ${SYNTHEA_POPULATION:-300}
      SYNTHEA_REFERENCE_DATE: ${SYNTHEA_REFERENCE_DATE:-20260105}
    volumes:
      - ./data:/data
      - ./tools/synthea:/tools:ro

volumes:
  pgdata:
  heartbeat:
  promdata:
  grafanadata:

networks:
  closure:
