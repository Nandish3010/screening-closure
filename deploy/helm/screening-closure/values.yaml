# Screening closure engine - Helm values (F14). Every value is a placeholder or a safe default: no real secret, registry,
# hostname or address is committed. Nothing here is a deployment claim; docs/governance/deployment.md lists what DoH must
# authorise first (ADHICS cloud rule).

imagePullSecrets: []

images:
  api:       { repository: REGISTRY/screening-closure-api,       tag: "0.1.0", pullPolicy: IfNotPresent }
  scheduler: { repository: REGISTRY/screening-closure-scheduler, tag: "0.1.0", pullPolicy: IfNotPresent }
  watchdog:  { repository: REGISTRY/screening-closure-watchdog,  tag: "0.1.0", pullPolicy: IfNotPresent }

# Pod and container hardening, applied to every workload (the Python images run as any uid; the api image's own user is 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true   # the only writable path is an emptyDir at /tmp
  capabilities: { drop: [ALL] }

api:
  replicas: 2                    # A31: several replicas are safe, one is elected leader for the background loops (leader lease)
  port: 8000
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 1Gi }
  sweepWorkers: ""               # SWEEP_WORKERS; empty = min(4, cpus). Keep it at or below the cpu limit.
  # M7-8 (ADR-048) load shedding: at most this many requests in flight in ONE API process (= one pod); the next one gets 503 with
  # Retry-After at once instead of queueing until it times out. 0 switches it off. /health, /scheduler/*, /watchdog/* and /metrics are
  # never shed (a busy API must still take the lease renewal and the probe). 40 = the thread pool the sync routes run on; the database
  # pool (10) is the real limit, so a request over 40 would only wait for it. Measured on the kind cluster: docs/results/scale.md.
  maxInflightRequests: 40
  shedRetryAfterSeconds: 1
  # The uvicorn process. workers 1 = one process per pod (the measured configuration). limitMaxRequests > 0 recycles a worker after
  # that many requests (a MITIGATION for slow memory growth, not a fix; it needs workers >= 2 so a supervisor restarts the worker
  # while the other serves; with workers 1 the whole container would exit and restart). 0 = never recycle. See docs/results/scale.md.
  server: { workers: 1, limitMaxRequests: 0 }
  podDisruptionBudget: { minAvailable: 1 }
  probes:
    startup:   { initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 36 }   # migrations run in the lifespan: allow 3 min
    liveness:  { periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
    readiness: { periodSeconds: 5,  timeoutSeconds: 3, failureThreshold: 3 }
  service: { type: ClusterIP, port: 8000 }   # nodePort: 30000-32767, only with type NodePort (throw-away clusters; kind maps a host port to it)
  ingress:
    enabled: false
    className: ""
    host: closure.example.invalid   # placeholder
    tlsSecretName: ""               # TLS terminates here or at the platform's gateway; the API itself speaks plain HTTP
    annotations: {}
  topologySpread: true

scheduler:
  replicas: 2                    # A31: one leads, the other idles as a follower and takes over within the lease TTL
  # M7-8 (ADR-047): every periodic job is a fixed-rate timed task of its own, gated on the lease and fenced with its token. A task STARTS
  # every `...IntervalSeconds` (start to start, not end to start); a tick that overruns is skipped, never run twice in parallel or made up in a burst.
  intervalSeconds: 10            # the sweep (SCHEDULER_INTERVAL_SECONDS)
  automationIntervalSeconds: 10  # POST /scheduler/automation-scan
  evidenceIntervalSeconds: 10    # POST /scheduler/evidence-scan
  agencyIntervalSeconds: 60      # POST /scheduler/agency-run; 0 = no agency task. 60 = what "every 6th sweep" was. The agency is also off when app.agencyEverySweeps is "0".
  cadenceLogSeconds: 300         # how often each task logs its achieved cadence
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

watchdog:
  replicas: 1
  idleDays: 7
  # M7-7: 10 s is measured safe. The scan reads an index (ADR-045): at 1,000,000 open cases a steady-state scan took 0.28 s and the longest catch-up scan
  # 6.3 s (time budget 5 s), the API held 250 requests/s with the watchdog at this interval. Before M7-7 a scan took 224-230 s and 10 s was unsafe.
  intervalSeconds: 10
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

migrate:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  backoffLimit: 2
  activeDeadlineSeconds: 900

# Non-secret application settings (api/app/config.py). The chart sets the values the API insists on outside APP_ENV=dev:
# AUTH_MODE=oidc, DEV_LOGIN_ENABLED=false, CLOCK_MODE=wall, no demo approval.
app:
  env: production
  oidcIssuer: https://idp.example.invalid/realms/placeholder   # must be https
  oidcAudience: screening-closure
  oidcJwksUrl: ""               # empty = <issuer>/protocol/openid-connect/certs
  oidcRoleClaim: realm_access.roles
  oidcRoleMap: ""
  fhirBaseUrl: https://fhir.example.invalid/fhir               # the host's FHIR server (HAPI or the provider's)
  fhirVerifyEvidence: "true"
  fhirProjection: "true"
  automationEnabled: "true"
  leaderLeaseTtlSeconds: "30"
  # Run the agency layer (supervisor -> heads -> executioners) after every N-th scheduler sweep; "0" = never. Empty = not rendered,
  # the API's code default applies (6). M7-7: a run reads at most AGENCY_MAX_CASES_READ (400) cases and resumes where it stopped, so it
  # is safe at a very large population (M7-6: the unbounded read OOM-killed a 768Mi pod at ~1M cases).
  agencyEverySweeps: ""
  # M7-8 (ADR-047): the agency runs on the scheduler's own timer (scheduler.agencyIntervalSeconds), not by counting sweeps. With "true" the sweep
  # route no longer counts for it; app.agencyEverySweeps stays the on/off switch ("0" = off).
  agencyOwnCadence: "true"
  # M7-8: GET /metrics/closure and /metrics/effort read the case_metrics table and first replay changed cases for at most this many seconds.
  metricsRefreshBudgetSeconds: "3"
  requireLeaderFence: "true"    # scheduler calls without a current leader token are refused
  logFormat: json
  corsAllowOrigins: ""          # the web app's origin(s), comma separated
  # Observability: leave empty to export nothing (the protected /metrics still works).
  otlpEndpoint: ""              # e.g. http://otel-collector.observability.svc:4318
  llmProvider: template         # template = no model call; any other value needs the AI cut's own settings and approval

# Mounted at /config. Create it from the repository's config/ files (docs/governance/deployment.md):
#   kubectl -n NAMESPACE create configmap screening-closure-config \
#     --from-file=calendar.yaml=config/calendar.yaml --from-file=colorectal_fit.yaml=config/pathways/colorectal_fit.yaml \
#     --from-file=providers.yaml=config/providers.yaml --from-file=outreach_policy.yaml=config/outreach_policy.yaml \
#     --from-file=agency.yaml=config/agency.yaml
# The outreach policy ships UNSIGNED and an unsigned policy sends nothing: the clinical lead's signature goes into that file.
config:
  existingConfigMap: screening-closure-config
  items:
    - { key: calendar.yaml,        path: calendar.yaml }
    - { key: colorectal_fit.yaml,  path: pathways/colorectal_fit.yaml }
    - { key: providers.yaml,       path: providers.yaml }
    - { key: outreach_policy.yaml, path: outreach_policy.yaml }
    - { key: agency.yaml,          path: agency.yaml }

# Secrets. Preferred: `existingSecret` names a Secret that already exists, filled from Azure Key Vault (CSI driver or External
# Secrets) with the keys listed under `placeholders`. `create: true` renders a Secret from `placeholders` for `helm template`
# and throw-away clusters ONLY: the values are the literal text CHANGE_ME and the API refuses to start with them.
#   DATABASE_URL          the unprivileged role closure_app (api)
#   MIGRATE_DATABASE_URL  the schema owner (migrate job only)
#   the tokens and DEV_AUTH_SECRET: random, 32 bytes or more, all different
secrets:
  existingSecret: screening-closure-secrets  # a Secret's name, not a value  # secrets-scan: allow
  create: false
  placeholders:
    DATABASE_URL: "postgresql://closure_app:CHANGE_ME@DB_HOST:5432/closure?sslmode=require"
    MIGRATE_DATABASE_URL: "postgresql://closure_owner:CHANGE_ME@DB_HOST:5432/closure?sslmode=require"
    APP_DB_PASSWORD: CHANGE_ME
    DEV_AUTH_SECRET: CHANGE_ME
    SCHEDULER_SERVICE_TOKEN: CHANGE_ME
    WATCHDOG_SERVICE_TOKEN: CHANGE_ME
    AUTOMATION_SERVICE_TOKEN: CHANGE_ME
    AGENCY_SERVICE_TOKEN: CHANGE_ME
    METRICS_SCRAPE_TOKEN: CHANGE_ME

# Network policy: default deny in both directions for every pod of the release, then only what each component needs.
networkPolicy:
  enabled: true
  dnsNamespaceLabels: { kubernetes.io/metadata.name: kube-system }
  # Who may reach the API port: pods in these namespaces (the ingress controller; Prometheus for /metrics).
  ingressFrom:
    - namespaceLabels: { kubernetes.io/metadata.name: ingress-nginx }
  metricsFrom:
    - namespaceLabels: { kubernetes.io/metadata.name: observability }
  # Extra source ranges allowed to reach the API port (e.g. a node/host range for NodePort access in a throw-away cluster).
  ingressCidrs: []
  # Egress of the API (and the migrate job for the database). CIDRs are placeholders; use the private endpoints' addresses.
  # An empty cidr switches that rule off (fhir, oidc). The database rule must match the database's POD or private-endpoint
  # address, not a Service ClusterIP (NetworkPolicy is evaluated after the Service address is translated).
  egress:
    database: { cidr: 10.20.2.0/24, port: 5432 }
    fhir:     { cidr: 10.20.3.0/24, port: 443 }
    oidc:     { cidr: 10.20.4.0/24, port: 443 }
    otlp:     { cidr: "", port: 4318 }      # empty = no egress rule
    extra: []                               # more raw NetworkPolicy egress rules

podAnnotations: {}
nodeSelector: {}
tolerations: []
