# The hosted judge demo (docs/governance/hosting-gcp.md): an OVERLAY on the repository's docker-compose.yml, used on the one
# Compute Engine VM as  COMPOSE_FILE=docker-compose.yml:deploy/gcp/compose.gcp.yml  (deploy/gcp/vm/env.sh sets it).
# It never changes how `make up` runs on a laptop. Everything the base file publishes stays on 127.0.0.1; the ONLY container
# published on a public interface is `caddy` (80/443), and it is in the `public` profile, so the seed phase (deploy/gcp/seed.sh)
# runs with no public listener at all.
#
# Secrets come from Secret Manager through deploy/gcp/vm/render_env.py into /etc/sc/*.env (root, mode 0600); none is in this file.

# Container logs: json-file with a size cap, so a chatty container (the API at LOG_FORMAT=json, HAPI, Keycloak) cannot fill the
# 10-20 GB boot disk over the judging window. 3 files x 10 MB per container is about 300 MB for the ten of them. Applied to every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: /etc/sc/api.env
        required: true
    # HAPI and the API stay on the private compose network; no new ports.
    # BUG-77: a limit makes "memory is high" mean something. deploy/gcp/vm/sc-api-restart.sh restarts the API at 70% of it (about
    # 717 MiB) and, once a day, at 40%; an OOM kill at the limit would also be restarted by the policy above, but abruptly.
    mem_limit: 1024m
    # Reliability review (8 Nov 2026), memory: glibc keeps one malloc arena per thread; on a 4 GB host that fragmentation is the slow
    # climb BUG-77 restarts away. Two arenas cost nothing measurable here and cap it. (Idle on the VM: api 192 MiB of 1 GiB.)
    environment:
      MALLOC_ARENA_MAX: "2"
    # ADR-058: the folder through which the web's "Reset the demo" asks the host (deploy/gcp/vm/demo-reset-watch.sh) and the host
    # answers (status.json). Create it on the VM first (the watch script does): it must be writable by uid 10001.
    volumes:
      - /var/lib/sc-demo:/var/lib/sc-demo

  scheduler:
    # The lease/fencing design (ADR-041) is kept as is; ONE scheduler here (no scale profile), so the lease is trivially held.
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: /etc/sc/scheduler.env
        required: true

  watchdog:
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: /etc/sc/watchdog.env
        required: true

  fhir:
    restart: unless-stopped
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${FHIR_HEAP_MB:-768}m
    mem_limit: 1300m

  postgres:
    restart: unless-stopped
    logging: *logging

  # Keycloak in PRODUCTION mode (`start`, not `start-dev`): its own database in the same Postgres server, behind the edge at /auth.
  # The realm is the committed one with the public host as the only redirect URI (vm/render_realm.py). Admin console is not routed
  # publicly (edge/nginx.conf.template); reach it with an IAP SSH tunnel to 127.0.0.1:8180 if you ever need it.
  keycloak-prod:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [public]
    restart: unless-stopped
    logging: *logging
    command: ["start", "--import-realm"]
    mem_limit: 700m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set by render_env.py}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${SC_PUBLIC_HOST:?set by render_env.py}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set by render_env.py}
      KC_PW_LAB: ${KC_PW_LAB:?}
      KC_PW_COORDINATOR: ${KC_PW_COORDINATOR:?}
      KC_PW_OWNER: ${KC_PW_OWNER:?}
      KC_PW_SPECIALIST: ${KC_PW_SPECIALIST:?}
      KC_PW_CLINICIAN: ${KC_PW_CLINICIAN:?}
      KC_PW_SUPERVISOR: ${KC_PW_SUPERVISOR:?}
      KC_PW_PATIENT: ${KC_PW_PATIENT:?}
      KC_DEMO_CLIENT_SECRET: ${KC_DEMO_CLIENT_SECRET:?}
      DEMO_PATIENT_REF: ${DEMO_PATIENT_REF:-Patient/demo-patient}
    volumes:
      - /etc/sc/keycloak-import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    networks: [closure]

  # Reply triage, on-premises: the SAME fine-tuned Qwen2.5-1.5B + LoRA, merged and converted to GGUF (tools/triage/convert_gguf.sh),
  # run on this VM's CPU by llama.cpp. `triage` speaks the existing triage-server contract (POST /classify, as `make triage-serve`) and
  # adds the opt-out gate, this build's calibration and the dialect rule; the API reaches it through TRIAGE_REMOTE_URL. No published
  # port, no third-party AI. The GGUF file is delivered by deploy.sh --model to /srv/sc/models/triage.gguf (not in git).
  triage-llama:
    image: ${TRIAGE_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: [triage]
    restart: unless-stopped
    logging: *logging
    command: ["-m", "/models/triage.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "2048", "-t", "2", "--parallel", "1", "--no-webui"]
    volumes:
      - /srv/sc/models:/models:ro
    mem_limit: 1500m
    # Two shared vCPUs serve sign-in (Keycloak password hashing), HAPI, Postgres and the API. One reply classification would take both
    # and starve a judge's sign-in for seconds; one vCPU for the model keeps the rest responsive (the template fallback covers a slow reply).
    cpus: 1.0
    # The image's own healthcheck curls :8080, but this server listens on 8081 (--port above), so it reported unhealthy while working.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks: [closure]

  triage:
    build:
      context: ./api
      target: runtime
    profiles: [triage]
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "app.triage.gguf_server", "--llama-url", "http://triage-llama:8081", "--port", "8765"]
    environment:
      TRIAGE_CALIBRATION_PATH: /app/app/triage/calibration_gguf.json
    depends_on: [triage-llama]
    networks: [closure]

  # nginx: serves the web build, routes /api and /auth, rate-limits the public API, blocks the service/ops paths.
  web:
    profiles: [public]
    restart: unless-stopped
    logging: *logging
    build:
      context: .
      dockerfile: deploy/gcp/edge/Dockerfile
      args:
        VITE_PUBLIC_HOST: ${SC_PUBLIC_HOST:?set by render_env.py}
    environment:
      SC_PUBLIC_HOST: ${SC_PUBLIC_HOST}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on: [api]
    networks: [closure]

  # Caddy: only TLS (automatic certificates, HTTP->HTTPS redirect). The one public listener.
  caddy:
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    profiles: [public]
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SC_PUBLIC_HOST: ${SC_PUBLIC_HOST:?set by render_env.py}
    volumes:
      - ./deploy/gcp/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]
    networks: [closure]

volumes:
  caddydata:
